name: Daily data

on:
  schedule:
    - cron: "5 0 * * *"    # 每天 UTC 00:05（台北 08:05），日線收盤後；Claude 日報 UTC 00:30（台北 08:30）接手
    # GitHub 高負載時排程可能延遲或整次被丟掉（2026-10-08 22:50／00:20 兩個排程都沒觸發），多排幾個備援時間；已更新就直接結束
    - cron: "15 0 * * *"
    - cron: "25 0 * * *"
    - cron: "45 0 * * *"
    - cron: "5 1 * * *"
  workflow_dispatch: {}
  # GitHub 定時排程常延遲數小時（2026-10-08 實測：00:45 的排程 06:14 才跑）。08:30 的 Claude 日報發現資料還沒更新時，
  # 會把目前時間寫進 .github/run-daily 並推送，推送觸發的工作會立刻執行
  push:
    branches: [main]
    paths: [".github/run-daily"]

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Skip if already updated
        id: chk
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          y = (dt.datetime.now(dt.timezone.utc).date() - dt.timedelta(days=1)).isoformat()
          print('skip=' + ('true' if json.load(open('data/latest.json'))['meta']['bar_date'] == y else 'false'))
          PY
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.chk.outputs.skip != 'true'
        run: pip install numpy
      - name: Collect market data
        if: steps.chk.outputs.skip != 'true'
        working-directory: pipeline
        run: |
          UP=$(python3 -c "import json;print(json.load(open('params.json'))['up'])")
          DOWN=$(python3 -c "import json;print(json.load(open('params.json'))['down'])")
          python3 collect.py --up "$UP" --down "$DOWN" --prev-state state_min.json
      - name: Update ETF flows
        if: steps.chk.outputs.skip != 'true'
        run: python3 pipeline/etf.py
      - name: Build site data
        if: steps.chk.outputs.skip != 'true'
        run: python3 pipeline/build.py pipeline/today.json
      - name: Commit
        if: steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "apogee-bot"
          git config user.email "apogee-bot@users.noreply.github.com"
          git add data pipeline/state_min.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: $(python3 -c "import json;print(json.load(open('data/latest.json'))['meta']['bar_date'])")"
          git pull --rebase --autostash
          git push
