name: Daily data

on:
  schedule:
    - cron: "5 0 * * *"    # 每天 UTC 00:05（台北 08:05），日線收盤後；Claude 日報 UTC 00:15（台北 08:15）接手（2026-11-06 起，原本 00:30）
    # GitHub 高負載時排程可能延遲或整次被丟掉（2026-10-08 22:50／00:20 兩個排程都沒觸發），多排幾個備援時間；已更新就直接結束
    # 2026-11-22 備援從四個減到兩個（cron-job.org 準時呼叫才是主力；已更新的備援每次也算一分鐘）
    - cron: "45 0 * * *"
    - cron: "5 1 * * *"
  workflow_dispatch: {}
  # 2026-10-12：GitHub 自己的排程每天晚 5–7 小時，改由 cron-job.org 準時呼叫 repository_dispatch（event_type: daily-data）。
  # 設定方法見 docs/CRON_JOB.md；上面的 schedule 與下面的 push 觸發保留當備援
  repository_dispatch:
    types: [daily-data]
  # GitHub 定時排程常延遲數小時（2026-10-08 實測：00:45 的排程 06:14 才跑）。08:15 的 Claude 日報發現資料還沒更新時，
  # 會把目前時間寫進 .github/run-daily 並推送，推送觸發的工作會立刻執行
  push:
    branches: [main]
    paths: [".github/run-daily"]

permissions:
  contents: write
  actions: write   # 2026-11-22 推了新提交後呼叫 cloudflare.yml 部署（GITHUB_TOKEN 推送不會觸發 push 事件）

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Skip if already updated
        id: chk
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          y = (dt.datetime.now(dt.timezone.utc).date() - dt.timedelta(days=1)).isoformat()
          print('skip=' + ('true' if json.load(open('data/latest.json'))['meta']['bar_date'] == y else 'false'))
          PY
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.chk.outputs.skip != 'true'
        run: pip install numpy
      - name: Collect market data
        if: steps.chk.outputs.skip != 'true'
        working-directory: pipeline
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}   # 2026-11-08 清算熱力圖多家交易所＋每日多空清算量；沒有也能跑（改用 OKX）
        run: |
          UP=$(python3 -c "import json;print(json.load(open('params.json'))['up'])")
          DOWN=$(python3 -c "import json;print(json.load(open('params.json'))['down'])")
          python3 collect.py --up "$UP" --down "$DOWN" --prev-state state_min.json
      - name: Update ETF flows
        if: steps.chk.outputs.skip != 'true'
        run: python3 pipeline/etf.py
      - name: Build site data
        if: steps.chk.outputs.skip != 'true'
        run: python3 pipeline/build.py pipeline/today.json
      - name: Build the site (app/index.html + data/next.js, then the landing page index.html)
        # 2026-11-11 首頁換成新版：用剛更新的資料重建（讀數由 pipeline/next/reads.py 產生；2026-11-17 起不再開舊版抽讀值）。失敗不擋資料提交
        if: steps.chk.outputs.skip != 'true'
        continue-on-error: true
        run: python3 pipeline/next/build.py
      - name: Prune ops images older than 3 days
        # 2026-11-15 使用者：三天前的配圖都不需要存（見 pipeline/prune_images.py）。失敗不擋資料提交
        if: steps.chk.outputs.skip != 'true'
        continue-on-error: true
        run: python3 pipeline/prune_images.py
      - name: Commit
        id: commit
        if: steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "apogee-bot"
          git config user.email "apogee-bot@users.noreply.github.com"
          git add data pipeline/state_min.json pipeline/coc_cache pipeline/cohort_cache index.html app/index.html sitemap.xml llms.txt latest.md latest.en.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: $(python3 -c "import json;print(json.load(open('data/latest.json'))['meta']['bar_date'])")"
          git pull --rebase --autostash
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: 部署到 Cloudflare（有推新提交才呼叫）
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cloudflare.yml --repo "${{ github.repository }}" --ref main -f from=daily
      - name: 每張圖的靜態小圖（滿 7 天或有新圖才重截）
        # 2026-11-22 原本 Share cards 每跑一次就截（一天五次），改成資料更新後一次。
        # 2026-11-25 使用者：只是給 GEO（單頁的圖、分享預覽）用，改成每週一次——上次截圖滿 7 天，或清單裡有上次沒截的新圖才呼叫。
        # 補跑資料也不會再多截。查不到就照舊呼叫，失敗不影響資料提交。
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          why=""
          upd=$(gh release view chart-img --repo "${{ github.repository }}" --json assets --jq '.assets[]|select(.name=="chart-img.tar")|.updatedAt' 2>/dev/null || true)
          if [ -z "$upd" ]; then why="還沒有小圖"; else
            age=$(( ( $(date -u +%s) - $(date -u -d "$upd" +%s) ) / 86400 ))
            if [ "$age" -ge 7 ]; then why="上次截圖已 $age 天"; else
              gh release download chart-img --repo "${{ github.repository }}" -p chart-img.tar -D "$RUNNER_TEMP" --clobber
              tar -xOf "$RUNNER_TEMP/chart-img.tar" ./list.json > "$RUNNER_TEMP/shot.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/shot.json"
              new=$(python3 pipeline/next/pages.py --img-list | python3 -c 'import json,sys;S=set(json.load(open(sys.argv[1])));print(" ".join(k for k in json.load(sys.stdin) if k not in S))' "$RUNNER_TEMP/shot.json")
              [ -n "$new" ] && why="新圖：$new"
            fi
          fi
          if [ -n "$why" ]; then echo "重截：$why"; gh workflow run chart-img.yml --repo "${{ github.repository }}" --ref main; else echo "小圖 $age 天前截的、沒有新圖，這次不截"; fi
