name: Share cards

on:
  # 每日任務推送中英文日報後立刻產生分享圖（data/share.png、data/share-en.png），給 X 貼文附圖用
  # 2026-11-04：同一個工作也畫「今日推薦圖表」（pipeline/picks.py → data/picks/），picks.json 單獨重推也會重畫
  push:
    branches: [main]
    paths: ["data/notes.json", "data/notes.en.json", "data/picks.json", "pipeline/next/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: share-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 2026-11-11 多了重建新版首頁（約 1 分鐘）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts cache
        id: fonts
        uses: actions/cache@v4
        with:
          path: ~/fonts
          key: share-fonts-v1
      - name: Download fonts (same as the site)
        if: steps.fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/fonts && cd ~/fonts
          curl -sSfL -o 'NotoSansTC[wght].ttf' 'https://github.com/google/fonts/raw/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf'
          curl -sSfL -o 'Archivo[wdth,wght].ttf' 'https://github.com/google/fonts/raw/main/ofl/archivo/Archivo%5Bwdth,wght%5D.ttf'
          curl -sSfL -o 'JetBrainsMono[wght].ttf' 'https://github.com/google/fonts/raw/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf'
      - name: Draw cards
        run: |
          pip install -q pillow
          python3 pipeline/share_card.py --fonts ~/fonts
      - name: CJK fonts for Chrome (picks screenshots)
        # 2026-11-06 推薦圖表第二版截網站原圖（ubuntu 內建 google-chrome）；網站內文的中文字靠系統字型，沒裝會變方塊
        continue-on-error: true
        run: sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - name: Draw picks (today's recommended chart)
        # 推薦圖表失敗不影響分享圖照常提交；截不到網站原圖時 picks.py 會改畫舊版簡化圖（有對應的才畫）
        continue-on-error: true
        run: python3 pipeline/picks.py render --fonts ~/fonts
      - name: Rebuild the new homepage with today's notes
        # 2026-11-11 首頁換成新版：頭條、各頁導言來自 notes，日報推送後要重建 data/next.js；失敗不擋分享圖提交
        continue-on-error: true
        run: python3 pipeline/next/build.py
      - name: Commit
        run: |
          git config user.name "apogee-bot"
          git config user.email "apogee-bot@users.noreply.github.com"
          git add data/share.png data/share-en.png 2>/dev/null || true
          git add -A data/picks 2>/dev/null || true
          git add data/next.js index.html pipeline/next/interp.zh.json pipeline/next/interp.en.json 2>/dev/null || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "share: $(python3 -c "import json;print(json.load(open('data/notes.json'))['date'])")"
          git pull --rebase --autostash
          git push
