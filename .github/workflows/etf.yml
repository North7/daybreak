name: ETF flows

on:
  schedule:
    - cron: "0 14 * * *"   # 每天 UTC 14:00（台北 22:00）：來源（2026-11-11 起 CoinMarketCap，見 pipeline/etf_src.py）白天補上前一個交易日後再抓一次；Daily data 00:05 也會抓
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # 2026-11-22 推了新提交後呼叫 cloudflare.yml 部署（GITHUB_TOKEN 推送不會觸發 push 事件）

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update ETF flows from CoinMarketCap
        run: python3 pipeline/etf.py
      - name: Commit
        id: commit
        run: |
          git config user.name "apogee-bot"
          git config user.email "apogee-bot@users.noreply.github.com"
          git add data/etf.json data/latest.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "etf: $(python3 -c "import json;print(json.load(open('data/etf.json')).get('last_complete'))")"
          git pull --rebase --autostash
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: 部署到 Cloudflare（有推新提交才呼叫）
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cloudflare.yml --repo "${{ github.repository }}" --ref main -f from=etf
