name: Prefetch on-chain

on:
  # 2026-11-25 拿掉 GitHub 自己的排程（原本 22:40 加 23:00 備援）：cron-job.org 準時呼叫才是主力；漏了這天也只是 Daily data 沿用前一天抓的那組
  # （bd_rotation.py 輪替抓，沒抓到的下次補）。每次「已抓過、直接結束」也算 1 分鐘。
  # 2026-10-12：由 cron-job.org 在 UTC 22:40 準時呼叫（event_type: prefetch），見 docs/CRON_JOB.md
  repository_dispatch:
    types: [prefetch]
  workflow_dispatch:
    inputs:
      group:
        description: "只有 A 組（2026-10-12 起全部每天抓）；可留空"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rotating bitcoin-data series
        env:
          GROUP: ${{ inputs.group }}
        run: python3 pipeline/bd_rotation.py ${GROUP:+--group "$GROUP"} ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && '--skip-if-fresh' || '' }}
      - name: Commit
        run: |
          git config user.name "apogee-bot"
          git config user.email "apogee-bot@users.noreply.github.com"
          git add pipeline/bd_cache
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "cache: bitcoin-data rotation $(date -u +%F)"
          git pull --rebase --autostash
          git push
