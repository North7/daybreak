name: Deploy to Cloudflare Pages

# 2026-11-11：網站開始同時部署到 Cloudflare Pages（之後綁 daybreak.aronlab.dev）。
# 搬家期間 GitHub Pages（north7.github.io/daybreak）照常運作，兩邊同時上線，確認沒問題才切換。
# 2026-11-16 使用者決定提前收掉並行：GitHub Pages 的來源改成 pages-redirect 分支，只剩一頁轉址，舊網址都帶到 daybreak.aronlab.dev 的同一個位置。
#
# 觸發：
#   - push 到 main（PR 合併、日報、回覆／長文等用個人帳號推上來的提交）
#   - 手動 workflow_dispatch
# Daily data / ETF flows / Share cards / Chart images 推了新提交（或更新了截圖）後，在自己的工作最後一步直接部署
#   （共用 .github/actions/deploy-cf；這幾個流程用內建 GITHUB_TOKEN 推送，不會觸發這裡的 push）。
#   2026-11-22 原本用 workflow_run，來源每跑一次（含「已更新、直接結束」的備援排程）就部署一次，改成有變才呼叫這裡；
#   2026-11-25 再改成直接接在原本的工作後面：另開一個部署工作至少算 1 分鐘，部署本身只要 30 秒左右（倉庫考慮改私有，Actions 要算額度）。
#   Prefetch on-chain 只更新 pipeline/bd_cache（Daily data 的輸入），不必部署。
# push 略過的路徑：只動到這些檔案的推送不在這裡部署——
#   data/notes*.json、data/picks.json、pipeline/next/**：Share cards 會被同一個推送觸發，重建後再呼叫部署（不然同一份內容部署兩次）
#   .github/run-daily：Daily data 跑完會部署；pipeline/bd_cache/**：只是資料快取
#   2026-11-25 data/replies*、data/longposts*（運營每天推約 30 次）：回覆／長文小幫手改從 /ops-live/ 即時讀 GitHub 上的最新版
#     （functions/ops-live/），不必為它們整站部署，下一次別的部署會一起帶上；ops 底下的 .py、.md 是運營在本機跑的工具和說明，網站用不到
#
# 需要倉庫 Secrets：CLOUDFLARE_API_TOKEN（權限 Account › Cloudflare Pages › Edit）、CLOUDFLARE_ACCOUNT_ID。
# 還沒設定時整個工作直接略過，不會失敗。

on:
  push:
    branches: [main]
    paths-ignore: ["data/notes.json", "data/notes.en.json", "data/picks.json", "pipeline/next/**", ".github/run-daily", "pipeline/bd_cache/**",
                   "data/replies.json", "data/replies/**", "data/longposts.json", "data/longposts/**", "data/img_seen.json", "ops/**/*.py", "ops/**/*.md"]
  workflow_dispatch:
    inputs:
      indexnow:
        description: "部署完通知搜尋引擎（IndexNow）"
        type: boolean
        default: false

permissions:
  contents: read

# 2026-11-22 改成不取消進行中的部署：連續推送時進行中的那次跑完，後面只留一個排隊（GitHub 會把更早排隊的取消，不算分鐘數），
# 排隊的那次一樣部署 main 最新內容。原本 cancel-in-progress 會把跑到一半的部署砍掉，那段時間白算。
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/deploy-cf
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
          indexnow: ${{ inputs.indexnow && 'true' || 'false' }}
