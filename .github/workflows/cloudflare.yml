name: Deploy to Cloudflare Pages

# 2026-11-11：網站開始同時部署到 Cloudflare Pages（之後綁 daybreak.aronlab.dev）。
# 搬家期間 GitHub Pages（north7.github.io/daybreak）照常運作，兩邊同時上線，確認沒問題才切換。
#
# 觸發：
#   - push 到 main（PR 合併、日報等用個人帳號推上來的提交）
#   - workflow_run：Daily data / ETF flows / Prefetch on-chain / Share cards 跑完之後。
#     這幾個流程用內建 GITHUB_TOKEN 推送，GitHub 不會因此觸發 push 事件，所以要另外接。
#   - 手動 workflow_dispatch
#
# 需要倉庫 Secrets：CLOUDFLARE_API_TOKEN（權限 Account › Cloudflare Pages › Edit）、CLOUDFLARE_ACCOUNT_ID。
# 還沒設定時整個工作直接略過，不會失敗。

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily data", "ETF flows", "Prefetch on-chain", "Share cards"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT: daybreak

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Secrets 還沒設定就略過
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 還沒設定，這次不部署。"

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: main   # workflow_run 也一律部署 main 最新的內容

      - name: 準備上傳的網站資料夾
        if: env.HAS_TOKEN == 'true'
        run: |
          # 跟 GitHub Pages 一樣，倉庫裡的檔案都上線（.git、.github 除外）
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' ./ "$RUNNER_TEMP/site/"
          # 舊網址是 north7.github.io/daybreak/…；有人在新網域打了 /daybreak/… 也導回正確位置
          printf '/daybreak /  301\n/daybreak/* /:splat 301\n' >> "$RUNNER_TEMP/site/_redirects"
          echo "SITE_DIR=$RUNNER_TEMP/site" >> "$GITHUB_ENV"
          echo "files: $(find "$RUNNER_TEMP/site" -type f | wc -l)"

      - name: 確認 Pages 專案存在（第一次會建立）
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main

      - name: 部署
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.SITE_DIR }} --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true
