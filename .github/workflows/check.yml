name: Site checks

# 2026-10-12：PR 合併前自動檢查，避免把網站弄壞。資料管線每天直接推 main，不經過這裡
# 2026-10-21：網站更新大多直接推 main（10/13 之後約 10 次都沒跑過檢查），推送有動到程式時也檢查；只動資料的推送不觸發
on:
  pull_request:
  push:
    branches: [main]
    paths: ["assets/**", "index.html", "post.html", "manifest.webmanifest", "pipeline/**.py", "tests/**", ".github/workflows/check.yml"]
  workflow_dispatch: {}

jobs:
  check:
    # 2026-10-21：ubuntu-latest 已是 26.04，Playwright 1.56.1 不支援（裝不了 chromium），固定在 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check assets/app.js
          node --check assets/i18n-en.js
          python3 -m py_compile pipeline/*.py
          python3 -c "import json,glob;[json.load(open(f)) for f in glob.glob('data/*.json')+['manifest.webmanifest']]"
      - name: English dictionary covers every string
        run: python3 pipeline/check_i18n.py
      - name: Asset versions are stamped
        run: |
          cp index.html /tmp/index.before && python3 pipeline/stamp_assets.py && diff -q /tmp/index.before index.html || (echo "index.html 的 ?v= 版本號沒更新：請執行 python3 pipeline/stamp_assets.py 後再提交" && exit 1)
      - name: Render every section (zh/en × desktop/mobile)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/smoke.js
