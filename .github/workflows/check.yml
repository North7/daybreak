name: Site checks

# 2026-10-12：PR 合併前自動檢查，避免把網站弄壞。資料管線每天直接推 main，不經過這裡
# 2026-10-21：網站更新大多直接推 main（10/13 之後約 10 次都沒跑過檢查），推送有動到程式時也檢查；只動資料的推送不觸發
# 2026-11-22 省 Actions 分鐘數（考慮改私有庫）：
#   - PR 合併進 main 的那次推送不再重跑（PR 上已經檢查過；squash 合併的訊息結尾是「(#編號)」），一週約 80 次
#   - 推送路徑拿掉 ops/**：回覆／長文工具的改動，這裡的檢查本來就沒測到
#   - 同一個 PR 連續推送，舊的那次取消
#   - Playwright 的瀏覽器放快取，不用每次下載
on:
  pull_request:
  push:
    branches: [main]
    paths: ["assets/**", "index.html", "llms.txt", "latest.md", "latest.en.md", "app/**", "intro/**", "post.html", "manifest.webmanifest", "pipeline/**.py", "tests/**", ".github/workflows/check.yml"]
  workflow_dispatch: {}

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '(#')
    # 2026-10-21：ubuntu-latest 已是 26.04，Playwright 1.56.1 不支援（裝不了 chromium），固定在 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # 2026-11-06：新圖變多，安裝 Playwright 慢的時候冒煙測試會超過 10 分鐘被取消（#53 連兩次）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          python3 -m py_compile pipeline/*.py pipeline/next/*.py pipeline/intro/*.py
          python3 -c "import re;s=open('app/index.html',encoding='utf-8').read();assert re.search(r'\.\./data/next.js\\?v=[0-9a-f]{10}',s),'app/index.html 沒有指到 data/next.js（請執行 python3 pipeline/next/build.py）'"   # 2026-11-20 數據頁搬到 /app/
          node --check data/next.js
          for f in data/next-*.js; do node --check "$f"; done   # 2026-11-15 各頁的卡片拆成獨立檔
          node --check data/intro.js   # 2026-11-19 介紹頁的資料
          node --check assets/hans.js   # 2026-11-25 簡體轉換器（兩頁選「简」時載入）
          python3 -c "import re;s=open('index.html',encoding='utf-8').read();assert re.search(r'\"data/intro.js\?v=[0-9a-f]{10}',s) and 'daybreak.seen' in s,'根目錄 index.html 不是介紹頁（請執行 python3 pipeline/intro/build.py）'"
          python3 -c "import json,glob;[json.load(open(f)) for f in glob.glob('data/*.json')+['manifest.webmanifest']]"
          # 2026-11-20 GEO：兩頁都要有給爬蟲的文字版和結構化資料，llms.txt、latest*.md 要在（pipeline/next/geo.py）
          python3 -c "import json,re,os;[(lambda s,f:(re.search(r'<main id=\"(oc|seo)-static\">',s) or exit(f+' 沒有文字版')) and [json.loads(m) for m in re.findall(r'<script type=\"application/ld\+json\">(.*?)</script>',s)] or exit(f+' 沒有結構化資料'))(open(f,encoding='utf-8').read(),f) for f in ('app/index.html','index.html')];[os.path.getsize(f)>500 or exit(f+' 太小') for f in ('llms.txt','latest.md','latest.en.md')]"
          # 2026-11-20 GEO 第二批：每張圖、每天簡報的頁面產生得出來（部署時才寫，這裡寫到暫存資料夾檢查）
          python3 -m pip install --quiet --break-system-packages opencc-python-reimplemented==0.1.7   # 2026-11-25 主題頁簡體版
          # 2026-11-25 assets/hans.js 要和 pipeline/next/hans.py（字典調整、TERMS）同一版：改了 hans.py 忘了重產就擋下來
          python3 pipeline/next/hans.py --js && git diff --exit-code --stat assets/hans.js || { echo '::error::assets/hans.js 不是最新，請執行 python3 pipeline/next/hans.py --js 再提交'; exit 1; }
          mkdir -p /tmp/geo && cp sitemap.xml /tmp/geo/ && python3 pipeline/next/pages.py --out /tmp/geo && test -s /tmp/geo/charts/dawn/index.html && test -s /tmp/geo/en/charts/index.html && test -s /tmp/geo/brief/index.html && test -s /tmp/geo/zh-hans/bitcoin-cycle/index.html && test -s /tmp/geo/en/bitcoin-cycle/index.html && test "$(grep -c '<url>' /tmp/geo/sitemap.xml)" -gt 200 && test -s /tmp/geo/zh-hans/charts/dawn/index.html && test -s /tmp/geo/zh-hans/brief/index.html && test -s /tmp/geo/zh-hans/feed.xml   # 2026-11-25 單頁、簡報、feed 的簡體版
      - name: Playwright browser cache
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-ubuntu-24.04
      - name: Render every section (zh/en × desktop/mobile)
        run: |
          npm i --no-save playwright@1.56.1
          # 2026-11-11：執行機有時連不到 Ubuntu 套件站（apt 解析失敗），--with-deps 會整個失敗。
          # 失敗時改成只裝瀏覽器本身（執行機已經有 Chrome 需要的系統套件）；瀏覽器開不起來的話，下面的渲染測試一樣會失敗。
          # 2026-11-22 快取裡有瀏覽器就不再裝（系統套件執行機本來就有，同上）
          if [ "${{ steps.pw.outputs.cache-hit }}" != "true" ]; then npx playwright install --with-deps chromium || npx playwright install chromium; fi
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/smoke_next.js
