/* 2026-11-16 舊版（classic.html）對外下線：舊網址（#onchain/sthsig 這種）由主程式轉到新版對應的圖，見 ㉝ */
/* 語言：使用者在任一版選過就沿用（daybreak.lang，和舊版共用）；沒選過看舊版查到的國家（快取 7 天），再沒有就看瀏覽器語言 */
window.DAYBREAK_LANG = (function () { var q = /[?&]lang=(zh|en)(&|$)/.exec(location.search); if (q) return q[1];   /* 2026-11-16：網址帶 ?lang=en／zh 就用那個語言（只管這一次，不改記住的選擇）；給別人連結時用 */
  var ls = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, p = ls('daybreak.lang'); if (p === 'zh' || p === 'en') return p;
  try { var g = JSON.parse(ls('daybreak.geo') || 'null'); if (g && g.cc && Date.now() - g.t < 7 * 864e5) return ['TW', 'HK', 'MO', 'CN', 'SG'].indexOf(String(g.cc).toUpperCase()) >= 0 ? 'zh' : 'en'; } catch (e) {}
  return /^zh/i.test(navigator.language || '') ? 'zh' : 'en'; })();
document.documentElement.lang = window.DAYBREAK_LANG === 'en' ? 'en' : 'zh-Hant';
</script>

<style>
/* 版面：單欄長頁。頁面本身安靜，三個可操作的原型各佔一個全寬畫框，個性留給原型。只做深色（Daybreak 發文與夜刊的那一面）。 */
:root {
  color-scheme: dark;
  --bg: #0A0A0B; --panel: #101012; --panel2: #16161A; --line: #232327; --line2: #36363D;
  --ink: #EFECE5; --ink2: #B4B0A7; --ink3: #7E7A72;
  --brand: #FF4A2E; --up: #2FD08A; --down: #FF4A2E;
  --hlA: #FF8A3D; --hlB: #2FBF8F; --dim: #4A4F7A;
  --s0: #4F6BEA; --s1: #2CA0CF; --s2: #19A56B; --s3: #D69A1E; --s4: #FF4A2E;
  --f-sans: "Geist", "Noto Sans TC", system-ui, sans-serif;
  --f-serif: "Inter Tight", "Noto Sans TC", system-ui, sans-serif;
  --f-mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.75 var(--f-sans); -webkit-font-smoothing: antialiased; }

.mono { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; color: var(--ink3); text-transform: uppercase; }
h1, h2, h3, p { margin: 0; }
h1 { font: 700 clamp(30px, 4.6vw, 46px)/1.25 var(--f-serif); letter-spacing: .01em; text-wrap: balance; }
h2 { font: 700 clamp(22px, 2.6vw, 28px)/1.35 var(--f-serif); text-wrap: balance; }
h3 { font: 700 15px/1.5 var(--f-sans); }
.lead { color: var(--ink2); max-width: 46em; font-size: 16px; }
.head { display: flex; flex-direction: column; gap: 18px; }
.sec { display: flex; flex-direction: column; gap: 24px; }
.sec > .sub { color: var(--ink2); max-width: 46em; }

/* 現況 */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line); }
.stats div { padding: 18px 16px 18px 0; display: flex; flex-direction: column; gap: 2px; }
.stats div + div { padding-left: 20px; border-left: 1px solid var(--line); }
.stats b { font: 600 clamp(26px, 3.4vw, 40px)/1.1 var(--f-sans); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stats span { color: var(--ink2); font-size: 13.5px; }
.two { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 40px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { padding: 12px 0; border-top: 1px solid var(--line); color: var(--ink2); }
.list li b { color: var(--ink); font-weight: 600; }

.try { grid-column: 2; font-size: 13.5px; color: var(--ink); display: flex; gap: 10px; align-items: baseline; }
.try i { font: 500 11px/1 var(--f-mono); font-style: normal; color: var(--bg); background: var(--ink); padding: 4px 7px; border-radius: 3px; letter-spacing: .04em; flex: none; }
.frame { border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; background: var(--panel); }
.fit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.fit div { border-top: 1px solid var(--line); padding-top: 12px; color: var(--ink2); font-size: 14px; }
.fit b { display: block; color: var(--ink); font: 500 11.5px/1.6 var(--f-mono); letter-spacing: .06em; margin-bottom: 2px; }

/* 圖表共用 */
.cht { display: block; max-width: 100%; height: auto; overflow: visible; }
.cht text { font-family: var(--f-mono); }
.cht .ax { font-size: 10.5px; fill: var(--ink3); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
.cht .lab { font: 600 11.5px var(--f-sans); fill: var(--ink); }

.cht .gl { stroke: var(--line); stroke-width: 1; }
.cht .base { stroke: var(--line2); stroke-width: 1; }
.cht [data-k] { transition: opacity .18s; }
.cht.hl [data-k] { opacity: .14; }
.cht.hl [data-k].on { opacity: 1; }
.tk { border-bottom: 1.5px dotted currentColor; padding: 0 1px; border-radius: 2px; cursor: default; transition: background .15s; outline: none; }
.tk[data-c="a"] { color: var(--hlA); } .tk[data-c="b"] { color: var(--hlB); } .tk[data-c="i"] { color: var(--ink); } .tk[data-c="c"] { color: var(--s1); } .tk[data-c="u"] { color: var(--up); } .tk[data-c="d"] { color: var(--down); }
.tk:hover, .tk.on, .tk:focus-visible { background: color-mix(in srgb, currentColor 20%, transparent); }

/* ── A 晨報 ── */
.pa { padding: 26px 28px 22px; display: flex; flex-direction: column; gap: 22px; background: #0C0C0D; }

/* ── B 週期儀 ── */
.pb { background: #08090D; display: flex; flex-direction: column; }

.pb button.b { font: 500 12px var(--f-mono); color: var(--ink); background: transparent; border: 1px solid var(--line2); border-radius: 999px; padding: 7px 14px; cursor: pointer; letter-spacing: .02em; }
.pb button.b:hover { border-color: var(--ink2); }
.pb button.b:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

/* ── C 問答 ── */
.pc { background: #0B0B0C; padding: 26px 28px 30px; display: flex; flex-direction: column; gap: 18px; }

table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 12px 16px 12px 0; border-top: 1px solid var(--line); color: var(--ink2); }
thead th { font: 500 11.5px var(--f-mono); letter-spacing: .06em; color: var(--ink3); border-top: 1px solid var(--line2); }
tbody th { color: var(--ink); font-weight: 600; white-space: nowrap; }

ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; }
ol.steps li { counter-increment: s; padding: 12px 0 12px 34px; border-top: 1px solid var(--line); position: relative; color: var(--ink2); }
ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 13px; font: 500 12px var(--f-mono); color: var(--brand); }
ol.steps li b { color: var(--ink); font-weight: 600; }

@media (max-width: 860px) {
  
  .stats, .mech { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats div:nth-child(3), .mech div:nth-child(3) { padding-left: 0; border-left: 0; }
  .stats div:nth-child(n+3), .mech div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .two, .rec, .fit, .pa-main, .pb-main { grid-template-columns: minmax(0, 1fr); gap: 24px; }

  .pa, .pc { padding: 18px 16px 20px; }
   .dir-h p, .try { grid-column: 1; }

}

.vd { display: flex; flex-direction: column; gap: 22px; padding-top: 76px; }

.scene { position: relative; width: 100%; overflow: hidden; border-block: 1px solid var(--line2); }

.done { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line2); }
.done div { padding: 16px 20px 0 0; color: var(--ink2); font-size: 14px; }
.done div + div { padding-left: 20px; border-left: 1px solid var(--line); }
.done b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

/* 1 網點 */
.n1 { background: #070707; padding: 22px clamp(16px, 4vw, 56px) 26px; display: flex; flex-direction: column; gap: 14px; }

/* 2 晨線 */
.n2 { height: clamp(500px, 54vw, 720px); user-select: none; -webkit-user-select: none; --x: 78%; --s: 60px; }

/* 3 儀表 */
.n3 { background: #090A0C; padding: 18px clamp(16px, 3vw, 40px) 22px; --hair: #1F2227; }

.n3 .lb { font: 500 10.5px var(--f-mono); letter-spacing: .08em; color: var(--ink3); text-transform: uppercase; }

.odo { display: inline-flex; align-items: flex-end; line-height: 1; }
.odo .od { display: inline-block; height: 1em; line-height: 1; overflow: hidden; }
.odo .odc { display: block; transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.odo .odc i { display: block; height: 1em; line-height: 1; font-style: normal; }
.odo .oc { line-height: 1; }

@media (max-width: 860px) {
  .vd { padding-top: 56px; }
  .after4, .done { grid-template-columns: minmax(0, 1fr); gap: 0; }
  
  .done div, .done div + div { padding: 14px 0 0; border-left: 0; }

}

/* ── 第三輪：五套全新的 VI。同一塊內容、同一組資料，換五種視覺。線、柱、刻度一律是向量，讀值精確 ── */
.vi { padding: 20px clamp(16px, 3.2vw, 44px) 26px; background: var(--v-bg); color: var(--v-ink); font-family: var(--v-f); position: relative; --v-r: 0px; --v-gap: 12px; --v-cr: 999px; }

.vi svg { display: block; overflow: visible; }
.vi svg text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--v-ink2); }
.vi svg text.el { font-family: var(--v-f); font-size: 11.5px; font-weight: 600; }

@media (max-width: 860px) {

}

/* 1 牆 */
.h1 { background: #040404; color: #F2F2EE; }

/* 2 單幀 */
.h2 { background: #0C0C0C; color: #EDEDEA; --a: #E8E4DA; transition: height .6s cubic-bezier(.2, .8, .2, 1); font-family: "Inter Tight", "Noto Sans TC", sans-serif; }

/* 3 地層 */
.h3 { background: #08080A; color: #F1EFEA; padding: 18px clamp(16px, 3vw, 40px) 20px; display: flex; flex-direction: column; gap: 12px; height: clamp(560px, 58vw, 760px); font-family: "Inter Tight", "Noto Sans TC", sans-serif; }

/* 4 空間 */
.h4 { background: #E7E8EA; color: #0D0E10; height: clamp(520px, 56vw, 760px); font-family: "Inter Tight", "Noto Sans TC", sans-serif; }

@media (max-width: 860px) {

}

/* ── 整合方案（第六輪）：空間排列三種、配色五套各有深淺。所有顏色走 .lvw 上的變數，切換時整個原型和圖表樣張一起換 ── */
.lvw { --bg: #060607; --sheet: #0E0E10; --ink: #EDEDE8; --k2: #8F8F8A; --ac: #C6FF3D; --up: #C6FF3D; --dn: #FF5A4D; --c3: #8C9BFF; --c4: #FFB454; --c5: #5CE1E6; --shim: #FFFFFF; --shadow: #000; }

.lv { background: var(--bg); color: var(--ink); height: clamp(640px, 62vw, 880px); font-family: "Inter Tight", "Noto Sans TC", sans-serif; transition: background-color .5s, color .5s; }

.sh.front::before { background: linear-gradient(90deg, transparent, var(--ac), transparent); left: 22%; right: 22%; }

.sh { position: absolute; left: 25%; top: 21%; width: 50%; aspect-ratio: 16 / 9.8; container-type: inline-size; background: var(--sheet); border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 16px; box-shadow: 0 60px 100px -50px var(--shadow); cursor: pointer; overflow: hidden; outline: none;
  transition: transform .9s cubic-bezier(.2, .8, .2, 1), opacity .6s, left .9s cubic-bezier(.2, .8, .2, 1), top .9s cubic-bezier(.2, .8, .2, 1), width .9s cubic-bezier(.2, .8, .2, 1), height .9s cubic-bezier(.2, .8, .2, 1), border-radius .9s, filter .6s, background-color .5s; }
.lv.stack .sh { left: 19%; top: 27%; width: 62%; aspect-ratio: 16 / 9.6; }
.sh::before { content: ""; position: absolute; left: 10%; right: 10%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 55%, transparent), transparent); z-index: 2; }
.sh:focus-visible { border-color: color-mix(in srgb, var(--ink) 60%, transparent); }
.lv.flat .sh.front { left: 0; top: 0; width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; cursor: default; border-color: transparent; }

.sh .big { font-family: var(--fn, inherit); font-weight: var(--fw, 400); font-stretch: var(--fst, 100%); font-size: 10.4cqw; line-height: 1; letter-spacing: var(--fls, -.05em); font-variant-numeric: tabular-nums; white-space: nowrap; }

.sh .s { font-size: max(12px, 1.5cqw); line-height: 1.65; color: color-mix(in srgb, var(--ink) 68%, var(--sheet)); max-width: 26em; }
.sh .ro { margin-top: auto; font: 500 max(10px, 1.15cqw) var(--f-mono); color: var(--k2); }

.sh-m svg, .ms svg { display: block; width: 100%; height: 100%; overflow: visible; }

.mini { background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 1.8cqw; align-items: center; padding: .7cqw; border-radius: 8px; min-width: 0; transition: background .2s; }
.mini:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.mini:focus-visible { outline: 1px solid color-mix(in srgb, var(--ink) 60%, transparent); }
.mk { font: 500 max(9.5px, 1.05cqw) var(--f-mono); letter-spacing: .08em; color: var(--k2); white-space: nowrap; }
.mv { grid-row: 2; font-family: var(--fn, inherit); font-stretch: var(--fst, 100%); font-weight: var(--fw, 400); font-size: max(14px, 2.3cqw); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ms { grid-row: 1 / span 2; grid-column: 2; height: max(30px, 4.6cqw); min-width: 0; }
.lv .shim { fill: none; stroke: var(--shim); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 55 945; stroke-dashoffset: 1000; animation: lvshim 6.5s linear infinite; }
.lv .pulse { fill: none; stroke: var(--ac); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: lvpulse 3s ease-out infinite; }

@keyframes lvshim { to { stroke-dashoffset: 0; } }
@keyframes lvpulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(3.6); opacity: 0; } }
@keyframes lvdrift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.6cqw); } }
@keyframes lvbeat { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
@container (max-width: 520px) {
  
  .sh .big { font-size: 15cqw; } .sh .s { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .sh .ro { margin-top: 0; }
  .ms { display: none; } .mini { grid-template-columns: minmax(0, 1fr); } 
}

@media (max-width: 860px) {  }
/* 圖表用色樣張 */
.cs { background: var(--bg); color: var(--ink); padding: 22px clamp(16px, 2.6vw, 36px) 26px; border-bottom: 1px solid #36363D; font-family: "Inter Tight", "Noto Sans TC", sans-serif; transition: background-color .5s, color .5s; display: flex; flex-direction: column; gap: 18px; }

.mv5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line2); }
.mv5 div { padding: 16px 16px 0 0; color: var(--ink2); font-size: 13.5px; }
.mv5 div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.mv5 b { display: block; color: var(--ink); font-weight: 600; font-size: 14.5px; margin-bottom: 2px; }
@media (max-width: 1000px) {  }
@media (max-width: 860px) {
  .sh, .lv.stack .sh { left: 6%; width: 88%; top: 28%; aspect-ratio: 4 / 4.4; }
  .lv { height: 740px; }
  
  .mv5 { grid-template-columns: minmax(0, 1fr); } .mv5 div, .mv5 div + div { padding: 12px 0 0; border-left: 0; }
  
}
@media (prefers-reduced-motion: reduce) { .lv .shim { display: none; } .lv .pulse, .sh-in, .lv-top .live i { animation: none; } }

/* ── 鏈上內頁：一個領域裡再分五片（總覽＋四個問題）。每一片是一張主圖加佐證，全部共用一條時間游標 ── */
.oc { background: var(--bg); color: var(--ink); height: clamp(720px, 68vw, 960px); font-family: "Inter Tight", "Noto Sans TC", sans-serif; transition: background-color .5s, color .5s; }
.oc-f { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.oc-top { position: absolute; left: clamp(16px, 2.4vw, 34px); right: clamp(16px, 2.4vw, 34px); top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 40; font: 500 11.5px var(--f-mono); letter-spacing: .1em; color: var(--k2); }
.oc-top b { color: var(--ink); font-weight: 500; letter-spacing: .3em; }
.oc-top b::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--ac); margin-right: 10px; vertical-align: -1px; }
.oc-top .r { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.oc-top .live i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--up); margin-right: 8px; vertical-align: 1px; animation: lvbeat 3s ease-in-out infinite; }
.tgl { display: inline-flex; border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); border-radius: 999px; padding: 2px; position: relative; }
.tgl button { font: 500 11px var(--f-mono); letter-spacing: .06em; color: var(--k2); background: none; border: 0; border-radius: 999px; padding: 5px 11px; cursor: pointer; position: relative; z-index: 1; transition: color .3s; }
.tgl button[aria-pressed="true"] { color: var(--bg); }
.tgl::before { content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: 999px; background: var(--ink); transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.tgl.b::before { transform: translateX(100%); }
.tgl button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

.oc-st { position: absolute; inset: 0; perspective: 1600px; perspective-origin: 60% 0%; }
.os { position: absolute; left: 16%; top: 20%; width: 81.5%; height: 70%; container-type: inline-size; background: var(--sheet); border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 16px; box-shadow: 0 60px 100px -50px var(--shadow); overflow: hidden; outline: none;

/* ════════════════════════════════════════════════════════════════════
   Daybreak next：整站骨架的樣式（2026-11-10 照整體規則重寫，取代之前一輪一輪疊上去的覆寫）
   規則：① 一頁三層：頭部（答案）→ 段落（小問題）→ 卡片（一張圖）
        ② 卡片固定四層：圖名 → 數字＋結論 → 控制＋圖例＋圖 → 一行補充；卡片裡沒有框、沒有色底
        ③ 顏色：字一律墨色／灰；橘紅只給異動的小點和頁面上最關鍵的數字；偏多偏空的顏色只在那幾個字和圖裡
        ④ 字級：段落標題、主圖數字、卡片數字、標題、內文、註記
        ⑤ 能點的只有三種長相：圖示圓鈕、分段切換、圖示展開鍵。能用圖示表達的鍵一律用圖示；文字只留給本身就是內容的選項（時間範圍、視角、章節、語言）
        ⑥ 彈簧只用在位置和大小；顏色用一般淡入
        ⑦ 圖上的標注文字一律放在膠囊裡（事件用實心，線的名字用細框）；色帶的說明放圖例，不寫在圖裡
        ⑧ 標題加粗：段落標題 800，圖名、結論標題、頁名 700
        ⑨ 展開、收回、進場只動位置、縮放和透明度（不裁切、不重畫大圖），才不會卡
        ⑪ 段落標題下面那一行是答案，不是問題：綜合這一段每張圖的結論，可以展開看每張圖各自說了什麼
        ⑫ 圖的顏色要鮮豔（會被截去當配圖）：色票用高飽和度，線不透明、夠粗，柱子不透明，色帶夠深；要壓暗的只有「重點上色」規則裡的其餘部分
        ⑬ 頭部的代表數字和今天頁的大標題用展示字（Archivo 壓窄 900／思源黑體 900），卡片裡的數字維持 Inter Tight
        ⑩ 找圖地圖（頂部九宮格鍵或按 /）：每張圖一格縮小版，可搜尋，點了就定位到那張圖
   ════════════════════════════════════════════════════════════════════ */
.oc { --t-sec: clamp(32px, 4.4vw, 66px); --t-hero: clamp(52px, 5cqw, 78px); --t-num: clamp(32px, 7cqw, 44px); --t-head: 17px; --t-body: 14px; --t-note: 12px;
  --rule: color-mix(in srgb, var(--ink) 11%, transparent); --soft: color-mix(in srgb, var(--ink) 78%, var(--sheet));
  --spring: cubic-bezier(.34, 1.56, .64, 1); }
@supports (transition-timing-function: linear(0, 1)) { .oc { --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1.004 83.8%, 1); } }

/* ── 互動的共通行為 ── */
.oc button { transition: transform .55s var(--spring), color .2s, background-color .2s, border-color .2s, opacity .2s; -webkit-tap-highlight-color: transparent; }

.oc button:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.oc details > summary { list-style: none; cursor: pointer; }
.oc details > summary::-webkit-details-marker { display: none; }

/* 圖示鍵的文字說明：游標停留一會兒才浮出來（整頁共用一個，由程式定位） */
.oc-tip { position: fixed; left: 0; top: 0; z-index: 200; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--sheet); font: 500 12px/1.25 "Inter Tight", "Noto Sans TC", sans-serif; letter-spacing: .02em; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateY(5px); transition: opacity .15s, transform .4s var(--spring); }
.oc-tip.on { opacity: 1; transform: none; }

/* ══ 導覽 ══ */
.oc-ch { position: relative; }
.oc-ch button[aria-current="true"] { color: var(--ink); border-bottom-color: transparent; }
.oc-tab { display: none; }
@media (min-width: 701px) {
  .oc-bar { padding-top: 12px; gap: 2px; }
  .oc-top b { font-size: 13px; }
  .oc-l { gap: 22px; flex: 1 1 auto; }
  .oc-ch { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .oc-ch button { font-size: 17px; font-weight: 500; letter-spacing: .04em; padding: 13px 18px 12px; border-bottom-width: 2px; }
  .oc-ch button[aria-current="true"] { font-weight: 600; }
  .oc-ch button:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 6%, transparent); }
}
@media (min-width: 701px) and (max-width: 1180px) { .oc-top .live { display: none; } .oc-ch button { padding-inline: 13px; font-size: 16px; } }
/* 每頁最後：上一頁／下一頁 */
.pn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 6px; }
.pn button { appearance: none; text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 18px 22px; border-radius: 16px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; font-family: "Inter Tight", "Noto Sans TC", sans-serif; }
.pn button:hover { border-color: color-mix(in srgb, var(--ink) 36%, transparent); }
.pn button.nx { text-align: right; align-items: flex-end; }
.pn small { display: block; color: var(--k2); } .pn button:hover small { color: var(--ink); } .pn small .ic { width: 20px; height: 20px; }
.pn b { font-size: 22px; font-weight: 700; }
.pn span { font-size: var(--t-body); line-height: 1.5; color: var(--k2); }

/* ══ 段落 ══ */
.oc-secs { max-width: none; gap: 84px; }
.fs-h { position: relative; border-top: 0; padding-top: 30px; flex-wrap: wrap; row-gap: 6px; }
.fs-h::before { content: ""; position: absolute; left: 0; top: 0; width: 64px; height: 2px; border-radius: 1px; background: var(--ac); }
.fs-h::after { content: ""; position: absolute; left: 72px; right: 0; top: .5px; height: 1px; background: var(--rule); }
.fs-h .k { font-size: 13px; }
.fs-h h3 { font-size: var(--t-sec); font-weight: 800; letter-spacing: -.025em; line-height: 1.08; white-space: normal; text-wrap: balance; min-width: 0; flex: 0 1 auto; }
.fs-h .sub { font-size: clamp(14px, 1.3vw, 19px); color: var(--soft); }

/* 段落的答案：標題下面一行，直接回答這一段的問題；可以展開看每張圖各自的結論 */
.fs-h .n { margin-left: auto; }
.fs-a { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 8px; min-width: 0; }
.fs-a b { font: 700 clamp(16px, 1.5vw, 21px)/1.5 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--ink); max-width: 62em; }
.fs-d { flex: 1 1 100%; min-width: 0; }
.fs-d > summary { display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 4px 11px 4px 6px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); font: 500 var(--t-note)/1 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--soft); font-variant-numeric: tabular-nums; transition: color .2s, background-color .2s, transform .55s var(--spring); }
.fs-d > summary .ic { transition: transform .5s var(--spring); }
.fs-d[open] > summary .ic { transform: rotate(180deg); }
.fs-d > summary:hover, .fs-d[open] > summary { background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); }
.fs-d > summary:active { transform: scale(.95); }
.fs-q { margin: 12px 0 4px; font-size: var(--t-note); line-height: 1.6; color: var(--k2); }
.fs-l { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0 32px; }
.oc .fs-r { appearance: none; display: grid; grid-template-columns: 3.6em minmax(0, 1fr); column-gap: 10px; align-items: start; text-align: left; padding: 11px 6px 11px 0; border: 0; border-top: 1px solid var(--rule); border-radius: 0; background: none; color: var(--ink); font-family: "Inter Tight", "Noto Sans TC", sans-serif; cursor: pointer; }
.oc .fs-r:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.oc .fs-r:active { transform: scale(.99); }
.fs-r .sy-t { padding-top: 2px; }
.fs-rb { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fs-rb small { font-size: var(--t-note); color: var(--k2); }
.fs-rb b { font: 700 var(--t-body)/1.4 "Inter Tight", "Noto Sans TC", sans-serif; }
.fs-rp { font-size: var(--t-note); line-height: 1.55; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ══ 卡片 ══ */
.fg { display: flex; flex-wrap: wrap; gap: 16px; }
.fg > .fc { flex: 1 1 540px; }
.fg > .fc.w, .fg > .fc:first-child:nth-last-child(n+3):not(.q) { flex-basis: 100%; }
.fc { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 22px 24px 16px; box-shadow: none; }
.fc:has([data-fx]) { cursor: zoom-in; }
.fc.q { cursor: pointer; }
@keyframes fcin { from { opacity: 0; transform: translateY(34px) scale(.965); } }
.oc.io .fc:not(.in) { opacity: 0; }
.oc.io .fc.in { animation: fcin .95s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 80ms); }
@media (hover: hover) {
  .fc { transition: transform .6s var(--spring), border-color .3s, background-color .5s; }
  .fc:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--ink) 20%, transparent); }
  /* 邊上一小段光跟著游標（墨色，不帶顏色） */
  .fc::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; background: radial-gradient(260px circle at var(--mx, -999px) var(--my, -999px), color-mix(in srgb, var(--ink) 70%, transparent), transparent 70%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; opacity: 0; transition: opacity .35s; pointer-events: none; z-index: 2; }
  .fc:hover::before { opacity: 1; }
}
.fc .ol { gap: 16px; }
.ol-a, .ol-b { display: contents; }
.ol > *, .ol-a > *, .ol-b > * { position: relative; z-index: 1; }

/* ① 圖名、展開鈕、異動 */
.fc h4.ol-n { font-size: var(--t-head); font-weight: 700; }
.ic { display: block; flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.fx-b { margin-left: auto; flex: none; position: relative; z-index: 3; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border-radius: 50%; background: none; border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); color: var(--ink); cursor: pointer; }
.fx-b::before { content: none; }
.fx-b.go { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 22%, transparent); background: none; }
.fc:hover .fx-b { border-color: color-mix(in srgb, var(--ink) 55%, transparent); }
.fx-b:hover, .fx-b:focus-visible { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.fx-b:hover .ic { transform: scale(1.12); } .fx-b .ic { transition: transform .5s var(--spring); }
.ol-sig { min-width: 0; }
.ol-sig > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 9px; font-size: var(--t-note); line-height: 1.5; color: var(--soft); }
.ol-sig > summary b { font-weight: 500; color: var(--ink); }
.sg-c { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--f-mono); letter-spacing: .08em; color: var(--ac); }
.sg-c i { width: 7px; height: 7px; border-radius: 50%; background: var(--ac); animation: lvbeat 1.6s ease-in-out infinite; }
.sg-n, .sg-f { color: var(--k2); font-variant-numeric: tabular-nums; }
.sg-i { padding: 9px 0 0 13px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: var(--t-note); line-height: 1.55; }
.sg-i b { font-weight: 600; color: var(--ink); }
.sg-i p { flex-basis: 100%; margin: 3px 0 0; color: var(--soft); }
.sg-i .sg-r { color: var(--k2); }

/* ② 答案：左邊數字，右邊結論 */
.ol-hl { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 30px; align-items: start; min-width: 0; }
.ol-hl.solo { grid-template-columns: minmax(0, 1fr); }
.ol-num { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fc .ol-k { font-size: var(--t-note); color: var(--k2); }
.fc .ol-big { font-size: var(--t-num); font-weight: 600; color: var(--ink); white-space: nowrap; }
.fc .ol-st { font-size: var(--t-note); max-width: 28em; }
.ol-st:has(> i) { padding: 0; background: none; }
.ol-say { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-left: 16px; border-left: 2px solid color-mix(in srgb, var(--ink) 18%, transparent); }
.sy-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 10px; }
.sy-t { font: 600 11px/1.3 var(--f-mono); letter-spacing: .08em; color: var(--sc, var(--k2)); white-space: nowrap; }
.sy-h > * { min-width: 0; max-width: 100%; } .sy-h > .sy-t { white-space: normal; overflow-wrap: anywhere; }   /* 2026-11-11 英文、字型還沒載入時「Read · Neutral」比欄寬，撐出 4px 橫向捲動 */
.sy-h b { font: 700 var(--t-head)/1.35 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--ink); }
.sy-d { margin: 0; font-size: var(--t-body); line-height: 1.65; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.ol-say.open .sy-d { -webkit-line-clamp: unset; display: block; }
.sy-c { margin: 0; font-size: var(--t-note); line-height: 1.6; color: var(--soft); }
.sy-v { margin: 0; font: 650 var(--t-head)/1.55 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--ink); text-wrap: pretty; }   /* ㉞-9 判讀句＝主角 */
.sy-tag { display: inline-block; margin: 0 9px 0 0; padding: 2px 8px 2px; border-radius: 999px; font: 700 11.5px/1.35 var(--f-mono); letter-spacing: .06em; vertical-align: 2px; color: var(--sc); background: color-mix(in srgb, var(--sc) 16%, transparent); }
.ol-say.v2 { gap: 8px; } .ol-say.v2 .sy-c { margin-top: -1px; } .ol-say.v2 .sy-m { margin-top: 2px; }
.sy-c i { font-style: normal; font-weight: 600; color: var(--ink); margin-right: 8px; }
.sy-r { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 10px; align-items: baseline; padding: 9px 0 2px; margin-top: 8px; border-top: 1px solid var(--rule); }
.sy-k { font-size: var(--t-note); color: var(--k2); }
.sy-r b { font: 600 var(--t-body)/1.3 "Inter Tight", "Noto Sans TC", sans-serif; font-variant-numeric: tabular-nums; }
.sy-r i { font: 600 11px var(--f-mono); font-style: normal; }
.sy-r p { grid-column: 1 / -1; margin: 3px 0 0; font-size: var(--t-note); line-height: 1.6; color: var(--soft); }
/* 加號文字鍵：全部讀值、怎麼讀這張圖 */
.sy-m > summary, .ol-how > summary { display: inline-flex; align-items: center; gap: 7px; width: fit-content; padding: 2px 0; font: 500 var(--t-note)/1 "Inter Tight", "Noto Sans TC", sans-serif; color: color-mix(in srgb, var(--ink) 66%, var(--sheet)); transition: color .2s, transform .55s var(--spring); }
.sy-m > summary .ic, .ol-how > summary .ic { transition: transform .5s var(--spring); }
.sy-m > summary { gap: 5px; padding: 3px 9px 3px 5px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); font-variant-numeric: tabular-nums; }
.sy-m[open] > summary .ic { transform: rotate(180deg); }
.ol-how > summary { justify-content: center; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
.ol-how[open] > summary, .sy-m[open] > summary { background: color-mix(in srgb, var(--ink) 14%, transparent); color: var(--ink); }
.sy-m > summary:hover, .ol-how > summary:hover { color: var(--ink); }
.sy-m > summary:active, .ol-how > summary:active { transform: scale(.94); }

/* ③ 圖：分段切換、圖例、圖 */
.oc .ol-ctl { position: relative; z-index: 3; gap: 4px 8px; }
.oc .md { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 0; background: none; border: 0; border-radius: 0; }
.oc .ol-ctl .md + .md { margin-left: 2px; padding-left: 10px; border-left: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
.oc .md button { appearance: none; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; min-height: 26px; padding: 0 10px; border-radius: 999px; font: 500 var(--t-note)/1 "Inter Tight", "Noto Sans TC", sans-serif; letter-spacing: .02em; color: var(--k2); cursor: pointer; white-space: nowrap; }
.oc .md button:hover:not([aria-pressed="true"]) { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
.oc .md button[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 15%, transparent); color: var(--ink); font-weight: 600; cursor: default; }
.ol-ctl .more { appearance: none; border: 0; background: none; padding: 2px 0; font: 500 var(--t-note)/1.4 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--k2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.ol-ctl .more:hover { color: var(--ink); }
.fc .ol-lg { font-size: var(--t-note); gap: 3px 14px; }
@container (min-width: 1000px) { .fc .ol-c { height: 360px; } .fc .ol-c.d3 { height: 420px; } }
@container (min-width: 1500px) { .fc .ol-c { height: 430px; } .fc .ol-c.d3 { height: 480px; } }
/* 圖進到畫面時由左到右出現：一片和底色相同的遮板往右滑開（只動位置，不重畫圖）；觀察器沒有回報的環境（例如縮圖）不放遮板 */
@keyframes wipe { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.oc.io .fc .ol-c::after, .oc-fx .ol-c::after { content: ""; position: absolute; inset: -3px; background: var(--sheet); transform-origin: 100% 50%; transform: scaleX(0); pointer-events: none; z-index: 2; }
.oc.io .fc:not(.in) .ol-c::after { transform: scaleX(1); }
.oc.io .fc.in .ol-c::after { animation: wipe 1s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 120ms); }

/* ④ 補充：一行小字 */
.ol-f { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; min-width: 0; min-height: 40px; padding: 10px 40px 0 0; border-top: 1px solid var(--rule); }
.ol-sx { display: flex; flex-wrap: wrap; gap: 3px 16px; margin: 0; font: 500 var(--t-note)/1.5 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--k2); }
.ol-sx span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ol-sx b { color: var(--soft); font-weight: 500; font-variant-numeric: tabular-nums; }
.ol-sx em { font-style: normal; color: var(--soft); margin-left: -3px; }
.sx-b { position: relative; flex: none; width: 46px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
.sx-b u { position: absolute; top: -3px; width: 3px; height: 9px; margin-left: -1.5px; border-radius: 1px; background: var(--ink); }
.ol-how { min-width: 0; flex: 1 1 100%; margin-right: -40px; }
.ol-how:not([open]) { flex: 0 0 0px; }
.ol-how > summary { position: absolute; right: 0; top: 6px; }   /* 鍵固定在右上角，點開、收起都在同一個位置 */
.ol-how p { margin: 8px 0 0; font-size: var(--t-body); line-height: 1.7; color: var(--soft); max-width: 70em; }
/* 清單裡的連結：不畫底線，後面一個外連小圖示（㉑ 5：原本是文字「↗」，換成同一套圖示） */
.oc .rl-n a { color: var(--ink); text-decoration: none; }
.oc .rl-n a:hover { color: var(--ac); }

/* 窄的卡片：數字和結論上下排 */
@container (max-width: 520px) { .ol-hl { grid-template-columns: minmax(0, 1fr); row-gap: 12px; } }
/* 每段的主圖（整列寬）：左邊是答案，右邊是圖，補充在最下面橫跨 */
@container (min-width: 980px) {
  .fc .ol[data-kind="t"] { display: grid; grid-template-columns: minmax(300px, 31%) minmax(0, 1fr); column-gap: 40px; row-gap: 16px; align-items: start; }
  .fc .ol[data-kind="t"] .ol-a, .fc .ol[data-kind="t"] .ol-b { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .fc .ol[data-kind="t"] .ol-hl { grid-template-columns: minmax(0, 1fr); row-gap: 18px; }
  .fc .ol[data-kind="t"] .ol-big { font-size: var(--t-hero); }
  .fc .ol[data-kind="t"] .sy-d { -webkit-line-clamp: 6; }
  .fc .ol[data-kind="t"] .ol-f { grid-column: 1 / -1; }
}

/* ══ 頭部 ══ */
.oc-hd .os { transition: transform .95s var(--spring), filter .5s, opacity .4s; }
@media (min-width: 1640px) { .oc-hd { height: 900px; } }
.ov-lead .hx, .br-h .hx { color: var(--ac); font-weight: inherit; }
.oc .ov-c { position: relative; transition: transform .55s var(--spring), border-color .25s, background-color .25s; }
.oc .ov-c:hover { border-color: color-mix(in srgb, var(--ink) 34%, transparent); background: color-mix(in srgb, var(--ink) 5%, transparent); }

/* ══ 今天頁的頭部：一張海報。最粗的大標題、撐滿寬度的巨大收盤價（上面壓近 20 天的價格線）、三個用色的大數字 ══ */
.ov.br { display: flex; flex-direction: column; gap: min(1.1cqw, 1.6cqh); align-items: stretch; }
.ov.br .ov-l { gap: min(1.1cqw, 1.6cqh); justify-content: flex-start; }
.bp-top { display: flex; align-items: center; gap: 1.4cqw; font: 500 max(10px, 1.05cqw) var(--f-mono); letter-spacing: .1em; color: var(--k2); white-space: nowrap; }
.bp-top i { flex: 1; height: 1px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
.bp-tag { background: var(--ac); color: var(--bg); font: 800 max(11px, 1.2cqw)/1 "Noto Sans TC", sans-serif; letter-spacing: .14em; padding: .5cqw 1cqw; }
.br-h { margin: 0; font: 900 clamp(22px, min(5.6cqw, 6.4cqh), 84px)/1.1 "Archivo", "Noto Sans TC", sans-serif; font-stretch: 92%; letter-spacing: -.012em; text-wrap: balance; color: var(--ink); }
.ov.br .br-h.lg { font-size: clamp(20px, min(4.6cqw, 5.4cqh), 70px); }
.ov.br .br-h.xl { font-size: clamp(18px, min(3.8cqw, 4.6cqh), 58px); }
.bp-bar { display: flex; justify-content: space-between; gap: 2cqw; padding-top: 1cqw; border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); font: 500 max(10px, 1.05cqw) var(--f-mono); letter-spacing: .08em; color: var(--k2); white-space: nowrap; }
.bp-bar b { color: var(--ink); font-weight: 500; }
.bp-big { position: relative; cursor: ew-resize; touch-action: pan-y; }
.bp-n { display: inline-block; font: 900 min(25cqw, 24cqh)/.84 "Archivo", "Inter Tight", sans-serif; font-stretch: 62%; letter-spacing: -.005em; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
.bp-l { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.bp-dot { position: absolute; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--ac); pointer-events: none; }
.bp-hint { margin: 0; text-align: right; font: 500 max(10px, .95cqw) var(--f-mono); letter-spacing: .06em; color: var(--k2); }
.bp-bot { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 3cqw; padding-top: 1.3cqw; border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); }
.bp-chips { display: flex; flex-wrap: wrap; gap: .8cqw; margin-bottom: .9cqw; }
.bp-chip { display: inline-flex; align-items: center; gap: .7cqw; font: 800 max(11px, 1.15cqw)/1 "Noto Sans TC", sans-serif; padding: .55cqw 1.1cqw; border: 1.5px solid var(--ink); }
.bp-chip.on { background: var(--ac); border-color: var(--ac); color: var(--bg); }
.bp-chip i { width: .55cqw; height: .55cqw; min-width: 5px; min-height: 5px; background: currentColor; }
.ov.br .br-s { margin: 0; font-size: max(12.5px, min(1.5cqw, 2.3cqh)); line-height: 1.7; color: color-mix(in srgb, var(--ink) 80%, var(--sheet)); max-width: none; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.bp-kp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.bp-k { display: flex; flex-direction: column; gap: .5cqw; min-width: 0; padding: 0 0 0 1.5cqw; border-left: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); }

/* ⑭ 動效（v53）。通則：只動 transform、opacity 和個別的 translate／rotate／scale；一組元素一定有先後（40–90ms）；按下先縮、放開回彈；靜止的東西至少有一個活著的訊號。prefers-reduced-motion 時全部關掉 */
@property --pax { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --pay { syntax: "<length>"; inherits: false; initial-value: 0px; }
.oc-prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: color-mix(in srgb, var(--ink) 42%, transparent); transform-origin: 0 50%; transform: scaleX(0); pointer-events: none; z-index: 2; }
@media (prefers-reduced-motion: no-preference) {
  @keyframes m-rise { from { opacity: 0; transform: translate3d(0, 24px, 0); } }
  @keyframes m-rise-s { from { opacity: 0; transform: translate3d(0, 11px, 0); } }
  @keyframes m-fade { from { opacity: 0; } }
  @keyframes m-pop { 0% { transform: scale(.86); } 50% { transform: scale(1.09); } 100% { transform: scale(1); } }
  @keyframes m-grow { from { transform: scaleX(0); } }
  @keyframes m-ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pc, var(--ac)) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 13px transparent; } }
  @keyframes m-wipe { from { clip-path: inset(-20% 100% -20% 0); } to { clip-path: inset(-20% 0 -20% 0); } }
  @keyframes m-dg { from { opacity: 0; transform: translate3d(0, .5em, 0) scaleY(.6); } }
  @keyframes m-land { from { opacity: 0; transform: perspective(1400px) translate3d(0, 54px, 0) rotateX(9deg) scale(.955); } }
  @keyframes m-float { 0%, 100% { translate: var(--pax) calc(var(--pay) - 3px); rotate: -.5deg; } 50% { translate: var(--pax) calc(var(--pay) + 3px); rotate: .5deg; } }
  @keyframes m-shine { 0%, 80% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
  /* 切換 1：換頁時大卡的內容一層一層進來（.bp-bot 本身不位移，程式要量它的位置） */
  .oc-hd .os.front .os-b .ov > * > *:not(.bp-bot), .oc-hd .os.front .bp-bot > * { animation: m-rise .85s var(--spring) backwards; }
  .oc-hd .os.front .bp-bot { animation: m-fade .5s calc(var(--bt, 0s) + .3s) backwards; }
  .oc-hd .os.front .os-b .ov > * > :nth-child(1) { animation-delay: calc(var(--bt, 0s) + .08s); } .oc-hd .os.front .os-b .ov > * > :nth-child(2) { animation-delay: calc(var(--bt, 0s) + .15s); } .oc-hd .os.front .os-b .ov > * > :nth-child(3) { animation-delay: calc(var(--bt, 0s) + .22s); } .oc-hd .os.front .os-b .ov > * > :nth-child(4) { animation-delay: calc(var(--bt, 0s) + .3s); } .oc-hd .os.front .os-b .ov > * > :nth-child(n+5) { animation-delay: calc(var(--bt, 0s) + .38s); }
  .oc-hd .os.front .os-b .ov > :nth-child(2) > * { animation-delay: calc(var(--bt, 0s) + .36s); }
  .oc-hd .os.front .bp-bot > :nth-child(1) { animation-delay: calc(var(--bt, 0s) + .42s); } .oc-hd .os.front .bp-bot > :nth-child(n+2) { animation-delay: calc(var(--bt, 0s) + .52s); }
  .bp-l { animation: m-wipe 1.5s cubic-bezier(.16, 1, .3, 1) calc(var(--bt, 0s) + .35s) backwards; }
  .bp-dot { animation: m-pop .6s var(--spring) calc(var(--bt, 0s) + 1.6s) backwards, m-ping 2.6s ease-out 2.3s infinite; }
  .oc .live i { --pc: var(--up); animation: m-ping 2.6s ease-out infinite; border-radius: 50%; }
  /* 切換 2：段落標題捲到才進場——紅線伸出來、細線跟著拉開、標題升上來；之後紅線每隔幾秒掃過一道光 */
  .fs-h::before, .fs-h::after { transform-origin: 0 50%; }
  .oc.mo .fs-h:not(.m-in) > * { opacity: 0; }
  .oc.mo .fs-h:not(.m-in)::before, .oc.mo .fs-h:not(.m-in)::after { transform: scaleX(0); }
  .oc.mo .fs-h.m-in::before { animation: m-grow .8s var(--spring) backwards, m-shine 7s linear 2s infinite; background-image: linear-gradient(100deg, transparent 35%, color-mix(in srgb, #fff 60%, transparent) 50%, transparent 65%); background-size: 240% 100%; background-repeat: no-repeat; }
  .oc.mo .fs-h.m-in::after { animation: m-grow 1.2s cubic-bezier(.16, 1, .3, 1) .12s backwards; }

  .oc.mo .fs-h.m-in > h3 { animation: m-rise .95s var(--spring) .1s backwards; }

  /* 切換 3：卡片帶一點前傾落下，裡面的名字、數字、圖、註腳一層層跟上；換時間範圍或畫法時（.m-re）內容快速重進 */
  .oc.io .fc.in { animation: m-land 1.05s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 90ms); }
  .fc .ol > :nth-child(2) { --j: 1; } .fc .ol > :nth-child(3) { --j: 2; } .fc .ol > :nth-child(4) { --j: 3; } .fc .ol > :nth-child(n+5) { --j: 4; }
  .oc.io .fc.in .ol > * { animation: m-rise-s .7s cubic-bezier(.16, 1, .3, 1) backwards; animation-delay: calc(var(--i, 0) * 90ms + 180ms + var(--j, 0) * 65ms); }
  .oc.io .fc.in.m-re .ol > * { animation-duration: .42s; animation-delay: calc(var(--j, 0) * 34ms); }
  .dg { display: inline-block; transform-origin: 50% 100%; animation: m-dg .75s var(--spring) backwards; animation-delay: calc(var(--dd, 0ms) + var(--d, 0) * 42ms); }
  .ol-how[open] > :not(summary) { animation: m-rise-s .4s cubic-bezier(.16, 1, .3, 1); }
  /* ⑲ 繪製效果 v2（2026-11-11，使用者：「飽和度太高、黑底下刺眼、佔太多目光，手機上尤其佔位，要高級一點」）。整套規則，CSS 和程式一起照這裡：
     1 顏色：五個 AI 不再各用一個高彩度的系列色。全部從次要文字色 --k2 出發，各混 14% 的系列色，只留很淡的色相差別：
       排版偏藍（--c3）、文案偏黃（--c5）、圖表偏青（--c4）；數據就是 --k2，校對是 --k2 和 --ink 各半（比較亮一點的灰）。
       不用綠（--up）和紅（--ac、--dn），綠紅只給方向。深淺兩個主題各自用自己的 --k2／--c3／--c4／--c5 算，所以淺色底上自動是深一點的灰。定義在 .oc 的 --ag-*。
     2 線：描邊一律 1px 實線，不用虛線。卡片外框 55% 不透明；區塊框、格線、參考線、上色刷邊 40% 以下，參考線最多 30%。
       沒有填色的色塊（區塊高亮只剩 1px 框）、沒有陰影、沒有光暈、沒有彈跳（spring 縮放），淡入淡出只動 opacity 和 transform。
     3 字：游標名字、外框尺寸、圖層名、「校對 AI」完成標記一律 10px、500 粗細、代理色的小字，不墊彩色底；
       要壓在內容上的（游標名字、完成標記）只墊一層 --sheet 85% 讓字讀得到。游標箭頭 13px，填代理色、描 1px 底色。
     4 數量：桌機照原本的分工（每張卡一個外框、四到六個游標）。手機（≤700px）每張卡只留外框、一個游標、打字的直線游標、格線和灰階上色；
       不顯示游標名字、外框尺寸、圖層名、參考線，完成標記只剩勾勾。頂部載入那一段手機上也只留排版和數據各一個游標。
     5 時間：不改原本的時間軸。畫過的卡片往回捲不重畫（⑱ SEEN）、只有寬度改了才重建、換頁才重畫，都照舊。
     6 狀態膠囊（.ag-dock）：取代原本的五個頭像加一句粗體字。
       桌機：右下 16px，26px 高；五個 5px 小點（代理色）＋一行 11px 次要色小字（這一頁今天幾張有訊號）。
       正在畫的時候（程式 agBusy）小點依序在 30%–90% 之間慢慢亮暗，1.8 秒一輪，不閃。畫完 2.4 秒後收起：
         有訊號：只剩小點和數字，滑鼠移上去或鍵盤聚焦才展開那句字，點一下捲到下一張訊號卡（校對 AI 在那張卡上框一下）；
         沒有訊號：整顆淡出（0.8 秒），不能點也就不留著。下一次有東西要畫（換頁）再出現。
       手機（≤700px）：右邊 12px、底部分頁列（56px）上方 24px（加安全區；㉘ 之後留位置給鼓包），22px 高，只有小點，有訊號時加數字，從不顯示字；收起、淡出規則同桌機。
       底色 --sheet 90%、1px 細框（--ink 10%），沒有陰影。頂部那一區不在畫面上時照舊藏起。
       有訊號時換一個樣子（.has；2026-11-15 使用者：「右下角這個訊號提示需要明顯一點，可以加入更明顯的動效，或其他設計」）。
         原本灰色小點加灰色小字，看起來像狀態列，不像「這裡有東西、可以點」。有訊號時整顆改成：
         強調色訊號點（8px，往外擴散兩圈 1px 的細環，2.4 秒一輪；是環不是光暈）＋強調色底的數字（深色字）＋一行主要色的字＋往下的小箭頭。
         桌機 34px 高、手機 30px 高（手機不顯示字）；底色 --sheet 不透明（壓在圖上時字才讀得到），邊框 --ac 55%，和訊號卡的框同一個顏色。
         五個代理小點只留給「沒有訊號」的狀態；有訊號時不再顯示，免得和訊號點搶。
         動效：這一頁第一次出現時用彈簧從下面彈上來（.pop，0.75 秒）；之後每 7 秒輕輕跳一下、共三次就停，不會一直動；按下去縮到 94%。
         點過之後數字改成「第幾張／共幾張」（1/3），字改成「下一張訊號」；換頁重算。
         收起規則照舊（畫完 2.4 秒後桌機收掉那行字，滑鼠移上去再展開），但訊號點、數字、箭頭一直在。換頁後新彈出來時，就算沒有東西在畫，也先展開 5 秒讓人讀到那行字再收。系統開了「減少動態」時，繪製效果不跑，改放一顆靜止的提示（見 8）。
     7 圖釘和訊號卡：留言圖釘 22px 圓形、--sheet 底、1px 細框、勾勾用次要色；訊號卡的圖釘勾勾用 --ac，淡入，不再一直脈動。
       訊號卡原本繞著邊轉的光改成靜止的 1px 框（--ac 45%）。數字改稿的刪除線用 --k2 1.5px，不用綠。
     8 prefers-reduced-motion 和分享模式（?share）：整段繪製程式不跑（⑭、⑮），沒有游標、訊號卡只有靜止細框；分享模式沒有膠囊，減少動態時另外放一顆靜止的訊號提示（同樣子，不彈不跳、沒有擴散環，2026-11-15）。

/* ㉘ 液態分頁（2026-11-12，使用者給了一段液態分頁列的錄影：「這種物理特性可以做嗎」→ 試作三種手感，選「彈跳」，並要電腦上也有）。
   用在第一層「今天和六個問題」（手機底部分頁列 .oc-tab、電腦頂部 .oc-ch）。第二層的段落導航後來搬到側邊（㉚），用的是同一個 LQ 的直向版。
   1 形狀：一條線上鼓起一個包，包的頂用 --ac 描邊、兩腳淡出（就是 logo 裡地平線上的太陽）；線本身是 --ink 13% 的細線。沒有光暈、沒有漸層底、沒有毛玻璃以外的東西。
     手機：線就是分頁列的上緣（取代原本的 border-top 和橘色短橫線），包是分頁列自己的底色鼓出去（實色 --bg，不透明：後面的圖和字不能從包裡透出來），高 13px、寬不超過一格（最多 62px），選中的圖示坐在包裡。
     電腦：線在七個字的正下方（取代原本的橘色底線），包高 8px、寬約字寬的八成（40–72px），描邊 3px，只有線、不填色。
   2 物理（程式 LQ）：包的前緣、頂點、後緣各一條彈簧，前緣最緊、後緣最鬆，所以換頁時會被拉長；高度另一條彈簧，目標是「原寬 ÷ 現在的寬」的 0.9 次方（夾在 0.3–1.15），拉得越長越扁，到位後回彈會過頭再收；回彈時最窄只到原寬的一半。
     點下去那一刻高度先往下沉一下。不是預錄動畫：連續點幾個分頁會從當下的形狀接著流。彈簧常數是使用者選的「彈跳」那一組，要改手感只改 LQ 裡的 K。
   3 浪經過的東西會被頂起來：手機是每個圖示（包高的 0.92 倍），電腦是每個字（0.4 倍）。只動 transform。
   4 電腦上滑鼠停在別的分頁：那個分頁下面的線微微鼓起 3px（灰線，不上色），移開就平回去。手機點下去在圖示上有一圈 --ink 的細圈擴散（0.5 秒）。
   5 prefers-reduced-motion 和分享模式：鼓包直接出現在新位置，不流動、沒有細圈、沒有滑鼠鼓起。換語言或改視窗寬度（格子寬度變了）也直接到位。
   7 第二層的經過（2026-11-12 同一天）：先是頂部第二排的直底線，使用者覺得「一級菜單是弧形彈性，二級是直的，放在一起總感覺有點違和」，三種高度裡選了 3px「微微鼓起」；接著使用者提出把它搬到側邊，於是頂部第二排整個拿掉，見 ㉚。留下的原則：上下兩層是同一種語言，用大小分主次，次要的那層安靜一點。
   6 分頁列上方要留 16px 給鼓包和回彈：手機右下的狀態膠囊因此從分頁列上方 12px 改成 24px。 */
/* ㉙ 頂部那一帶的橘線（2026-11-12，使用者：「二級菜單下面的線太粗了，很突兀」「這邊會堆疊很多線」：5px 的二級底線、橘色的閱讀進度線、段落標題上 5px 的短橫線三條疊在一起）。
   黏在上面的導覽列附近，橘色的線只有一個工作：第一層的鼓包（㉘）。（當時還有第二層選中項目下面那一小段；第二層後來搬到側邊，見 ㉚。）其他的線不搶：
   1 閱讀進度線：--ink 42% 的 1px，疊在導覽列的下邊框上，不用橘色。
   2 段落標題左上的短橫線：5px 改 2px，和右邊那條灰線同一高度，讀成同一條分隔線的開頭。
   3 點二級選單捲到段落時，標題停在導覽列下方 28px，不貼著導覽列：.fs 的 scroll-margin-top = --barh + 28px，--barh 是程式量到的導覽列高度（各寬度不一樣高，原本寫死 104／150px，平板貼太近、手機離 62px 還會標錯一段）；判斷「現在在哪一段」的界線跟著放寬到 48px。
   4 二級選單只有內容真的放不下才左右捲（手機常見），捲的時候把選中的項目放中間，不是靠左貼齊。（底線層和 --nw 在 ㉘-7 之後已經不存在，下面這段留作教訓。）底線層的寬度（--nw）用最後一顆按鈕的右緣算，不能用 scrollWidth：底線層自己會把 scrollWidth 撐住，從項目多的頁面換到項目少的頁面後縮不回來，選單就會被誤判成要捲、往左跑出畫面。
   全站不再有 5px 的橘色粗線。 */
svg.lq { position: absolute; left: 0; display: block; overflow: visible; pointer-events: none; }
.lq-f { fill: var(--bg); }
.lq-e { fill: none; stroke: color-mix(in srgb, var(--ink) 13%, transparent); stroke-width: 1; }
.lq-c { fill: none; stroke-width: 2.2; stroke-linecap: round; }
.oc-ch > svg.lq { top: 0; } .oc-ch .lq-f { display: none; } .oc-ch .lq-c { stroke-width: 3; }
.oc-ch button > span { display: inline-block; will-change: transform; }
@keyframes lq-ring { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(4.6); } }
/* ㉚ 側邊段落導航（2026-11-12，使用者：「二級菜單是負責上下方向的菜單，是不是可以放在側邊，這樣上面不會兩層菜單」，並給了一張參考圖：貼著螢幕邊緣長出來的黑色面板，上下兩端用內凹的圓角接回邊緣，裡面一格一個圓環；接著：「電腦端的是不是放在左邊，手機端不知道怎麼處理」）。
   參考圖好在三點：面板是從邊緣「長出來」的（和 ㉘ 的鼓包同一種液態語言）；每一格是圓環，導航順便是進度；上下排列對應上下捲動。照這三點用 Daybreak 自己的顏色做，不照抄黑底彩虹。
   1 取代頂部的第二排：導覽列只剩一排（原本的第二排 .oc-b2、.oc-sn 已移除）。電腦上第一層的鼓包直接坐在導覽列的下邊框上，不再自己畫一條灰線。
   2 位置：電腦貼左緣（段落標題的「02 / 04」也在左邊，編號對得上；右邊留給捲軸和右下的狀態膠囊）；手機貼右緣（第 7 點）。首屏還佔著大半個畫面時收在畫面外，捲過去才從左緣滑出來（首屏兩邊有小卡，首屏自己也列了各段）。
   3 面板：--sheet 實色、1px 細邊（--ink 13%），外側兩個角 18px 圓角，上下兩端各一個 16px 的內凹圓角接回螢幕邊緣。沒有陰影、沒有光暈。
   4 每一格：一個圓環，裡面是兩位數的段落編號；最上面那格是這一頁的圖示，按了回到頂部。圓環的弧是「這一段讀到哪」：讀完的是一整圈中性色（--ink 40%），正在讀的那段是 --ac，還沒到的只有底圈（--ink 14%）。
   5 現在在哪一段：面板的外緣在那一格往外鼓 6px（LQ 的直向版，同一組彈簧），鼓包的頂描 --ac、兩腳淡出，圓環跟著被頂出去一點。捲動換段時鼓包沿著外緣流過去。
   6 電腦（701px 以上）：寬 46px、垂直置中、所有段落都列出來，內容區左邊多留 40px 給它。滑鼠移到某一格或鍵盤聚焦，旁邊跳出那一段的名稱（--ink 底、--sheet 字，和 .oc-tip 同款）；平常不顯示字。
   7 手機（700px 以下）：貼右緣（2026-11-12 上線當天，使用者：「手機側邊欄是不是放在右側好一點，右手拇指可以滑動，放左邊不好點」；原本在左緣）。平常只露出一格（現在這一段的圓環），寬 30px，在畫面高度 64% 的地方，剛好落在頁面邊距（16px）和卡片內距（14px）裡，不蓋到圖右邊的數字。展開的清單圓環靠右、名稱在左。點一下展開成清單，每格圓環旁邊直接寫段落名稱；點其中一段就捲過去並收起來，點面板以外的地方也收起來。收合時不鼓包（它自己就是標記）。
   8 prefers-reduced-motion：面板直接出現、鼓包直接到位。分享模式不顯示。
   9 手機可以按住滑（2026-11-12，使用者提到「右手拇指可以滑動」，問了要不要加，回答「加」）：手指按在那顆圓環上往上或往下滑，清單就地展開（現在那一格留在手指底下），滑到哪一段那一段就亮、鼓包跟過去，放開就捲到那一段並收起來。點一下再點段落的做法照舊。
     不管是點還是滑，選了之後標記直接停在目的地那一段，捲過去的途中不會被拉回原本那一段再流過去（SIDE.lock，最多 1.8 秒）；電腦上點面板也一樣。 */
.oc-side { display: flex; flex-direction: column; position: fixed; left: 0; top: 50%; z-index: 58; width: 46px; padding: 18px 0; box-sizing: border-box; translate: 0 calc(-50% + var(--dy, 0px)); transform: translateX(calc(-100% - 16px)); visibility: hidden; transition: transform .7s var(--spring), visibility 0s .7s; }
.oc-side.on { transform: none; visibility: visible; transition: transform .7s var(--spring); }
.oc-side > svg.lq { left: -40px; top: -16px; transform: scaleX(-1); }
