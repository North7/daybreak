<script>
/* 2026-11-11 首頁換成新版，舊版搬到 classic.html。舊版的網址（#onchain/sthsig 這種）照樣能開：帶著舊版的頁面代號進來就轉到 classic.html 同一個位置 */
(function () { var chk = function () { var h = location.hash; if (/^#(overview|news|cycle|onchain|market|flows|deriv|exit|archive|method|calc|pg-[\w-]+)(\/|$)/.test(h)) location.replace('classic.html' + location.search + h); }; chk(); window.addEventListener('hashchange', chk); })();   // 開著首頁時才貼上舊網址（只換 # 後面）也要轉
/* 語言：使用者在任一版選過就沿用（daybreak.lang，和舊版共用）；沒選過看舊版查到的國家（快取 7 天），再沒有就看瀏覽器語言 */
window.DAYBREAK_LANG = (function () { var ls = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, p = ls('daybreak.lang'); if (p === 'zh' || p === 'en') return p;
  try { var g = JSON.parse(ls('daybreak.geo') || 'null'); if (g && g.cc && Date.now() - g.t < 7 * 864e5) return ['TW', 'HK', 'MO', 'CN', 'SG'].indexOf(String(g.cc).toUpperCase()) >= 0 ? 'zh' : 'en'; } catch (e) {}
  return /^zh/i.test(navigator.language || '') ? 'zh' : 'en'; })();
document.documentElement.lang = window.DAYBREAK_LANG === 'en' ? 'en' : 'zh-Hant';
</script>

<style>
/* 版面：單欄長頁。頁面本身安靜，三個可操作的原型各佔一個全寬畫框，個性留給原型。只做深色（Daybreak 發文與夜刊的那一面）。 */
:root {
  color-scheme: dark;
  --bg: #0A0A0B; --panel: #101012; --panel2: #16161A; --line: #232327; --line2: #36363D;
  --ink: #EFECE5; --ink2: #B4B0A7; --ink3: #7E7A72;
  --brand: #FF4A2E; --up: #2FD08A; --down: #FF4A2E;
  --hlA: #FF8A3D; --hlB: #2FBF8F; --dim: #4A4F7A;
  --s0: #4F6BEA; --s1: #2CA0CF; --s2: #19A56B; --s3: #D69A1E; --s4: #FF4A2E;
  --f-sans: "Geist", "Noto Sans TC", system-ui, sans-serif;
  --f-serif: "Inter Tight", "Noto Sans TC", system-ui, sans-serif;
  --f-mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.75 var(--f-sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 56px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 72px; }
.mono { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; color: var(--ink3); text-transform: uppercase; }
h1, h2, h3, p { margin: 0; }
h1 { font: 700 clamp(30px, 4.6vw, 46px)/1.25 var(--f-serif); letter-spacing: .01em; text-wrap: balance; }
h2 { font: 700 clamp(22px, 2.6vw, 28px)/1.35 var(--f-serif); text-wrap: balance; }
h3 { font: 700 15px/1.5 var(--f-sans); }
.lead { color: var(--ink2); max-width: 46em; font-size: 16px; }
.head { display: flex; flex-direction: column; gap: 18px; }
.sec { display: flex; flex-direction: column; gap: 24px; }
.sec > .sub { color: var(--ink2); max-width: 46em; }

/* 現況 */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line); }
.stats div { padding: 18px 16px 18px 0; display: flex; flex-direction: column; gap: 2px; }
.stats div + div { padding-left: 20px; border-left: 1px solid var(--line); }
.stats b { font: 600 clamp(26px, 3.4vw, 40px)/1.1 var(--f-sans); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stats span { color: var(--ink2); font-size: 13.5px; }
.two { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 40px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { padding: 12px 0; border-top: 1px solid var(--line); color: var(--ink2); }
.list li b { color: var(--ink); font-weight: 600; }
.mech { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line2); }
.mech div { padding: 18px 20px 4px 0; display: flex; flex-direction: column; gap: 6px; }
.mech div + div { padding-left: 20px; border-left: 1px solid var(--line); }
.mech p { color: var(--ink2); font-size: 14px; }
.mech .mono { color: var(--hlA); }

/* 方向的標頭與畫框 */
.dir-h { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 20px; row-gap: 10px; align-items: baseline; }
.dir-h .lt { font: 500 13px/1 var(--f-mono); color: var(--brand); letter-spacing: .08em; }
.dir-h p { grid-column: 2; color: var(--ink2); max-width: 46em; }
.try { grid-column: 2; font-size: 13.5px; color: var(--ink); display: flex; gap: 10px; align-items: baseline; }
.try i { font: 500 11px/1 var(--f-mono); font-style: normal; color: var(--bg); background: var(--ink); padding: 4px 7px; border-radius: 3px; letter-spacing: .04em; flex: none; }
.frame { border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; background: var(--panel); }
.fit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.fit div { border-top: 1px solid var(--line); padding-top: 12px; color: var(--ink2); font-size: 14px; }
.fit b { display: block; color: var(--ink); font: 500 11.5px/1.6 var(--f-mono); letter-spacing: .06em; margin-bottom: 2px; }

/* 圖表共用 */
.cht { display: block; max-width: 100%; height: auto; overflow: visible; }
.cht text { font-family: var(--f-mono); }
.cht .ax { font-size: 10.5px; fill: var(--ink3); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
.cht .lab { font: 600 11.5px var(--f-sans); fill: var(--ink); }
.cht .pilltx { font: 700 11.5px var(--f-sans); fill: #141414; }
.cht .gl { stroke: var(--line); stroke-width: 1; }
.cht .base { stroke: var(--line2); stroke-width: 1; }
.cht [data-k] { transition: opacity .18s; }
.cht.hl [data-k] { opacity: .14; }
.cht.hl [data-k].on { opacity: 1; }
.tk { border-bottom: 1.5px dotted currentColor; padding: 0 1px; border-radius: 2px; cursor: default; transition: background .15s; outline: none; }
.tk[data-c="a"] { color: var(--hlA); } .tk[data-c="b"] { color: var(--hlB); } .tk[data-c="i"] { color: var(--ink); } .tk[data-c="c"] { color: var(--s1); } .tk[data-c="u"] { color: var(--up); } .tk[data-c="d"] { color: var(--down); }
.tk:hover, .tk.on, .tk:focus-visible { background: color-mix(in srgb, currentColor 20%, transparent); }

/* ── A 晨報 ── */
.pa { padding: 26px 28px 22px; display: flex; flex-direction: column; gap: 22px; background: #0C0C0D; }
.pa-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line2); padding-bottom: 12px; }
.pa-top .r { display: flex; gap: 14px; align-items: baseline; }
.pa-top .px { font: 600 15px var(--f-mono); color: var(--ink); letter-spacing: 0; }
.pa-top .chip { font: 500 11px var(--f-mono); color: var(--bg); background: var(--brand); padding: 3px 8px; border-radius: 2px; letter-spacing: .04em; }
.pa-main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 36px; align-items: start; }
.pa-hl { font: 900 clamp(22px, 2.5vw, 30px)/1.35 var(--f-serif); text-wrap: balance; margin-bottom: 8px; }
.pa-sum { color: var(--ink2); font-size: 14px; margin-bottom: 18px; }
.pa-cl { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 0 14px 34px; position: relative; color: inherit; font: inherit; cursor: pointer; opacity: .42; transition: opacity .2s; }
.pa-cl:hover { opacity: .75; }
.pa-cl.on { opacity: 1; cursor: default; }
.pa-cl .n { position: absolute; left: 0; top: 17px; font: 500 12px var(--f-mono); color: var(--ink3); }
.pa-cl.on .n { color: var(--brand); }
.pa-cl .h { display: block; margin: 0 0 4px; font: 600 17px/1.5 var(--f-serif); }
.pa-cl .p { font-size: 14px; color: var(--ink2); display: none; }
.pa-cl.on .p { display: block; }
.pa-cl:focus-visible { outline: 1px solid var(--ink2); outline-offset: 2px; }
.pa-stage { border: 1px solid var(--line); border-radius: 8px; padding: 16px 16px 10px; background: var(--panel); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pa-stage .cap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pa-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
#pa-ch { min-height: 250px; }

/* ── B 週期儀 ── */
.pb { background: #08090D; display: flex; flex-direction: column; }
.pb-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.pb-top .btns { display: flex; gap: 8px; }
.pb button.b { font: 500 12px var(--f-mono); color: var(--ink); background: transparent; border: 1px solid var(--line2); border-radius: 999px; padding: 7px 14px; cursor: pointer; letter-spacing: .02em; }
.pb button.b:hover { border-color: var(--ink2); }
.pb button.b:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
.pb-main { display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 8fr); }
.pb-dial { position: relative; padding: 8px; background: radial-gradient(circle at var(--sx, 30%) var(--sy, 60%), color-mix(in srgb, var(--sc, #19A56B) 20%, transparent) 0, transparent 48%); transition: background .4s; }
.pb-dial svg { display: block; width: 100%; height: auto; max-height: 600px; margin: 0 auto; }
.pb-dial text { font-family: var(--f-sans); }
.pb-dial .stl { font: 600 14px var(--f-sans); letter-spacing: .12em; }
.pb-dial .yr { font: 500 9px var(--f-mono); fill: var(--ink3); paint-order: stroke; stroke: #08090D; stroke-width: 4px; }
.pb-dial .c-stage { font: 700 30px var(--f-sans); letter-spacing: .08em; }
.pb-dial .c-px { font: 600 40px var(--f-sans); fill: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.pb-dial .c-sm { font: 500 11px var(--f-mono); fill: var(--ink2); letter-spacing: .04em; }
.pb-dial .sp { transition: opacity .12s; }
.pb-dial .sp.fut { opacity: .07; }
.pb-side { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.pb-row { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--line); min-height: 70px; }
.pb-row:last-child { border-bottom: 0; }
.pb-row .nm { font-size: 12.5px; color: var(--ink2); }
.pb-row .v { font: 600 21px/1.2 var(--f-sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pb-row .w { font: 500 12px var(--f-sans); letter-spacing: 0; }
.pb-row svg { display: block; }
.pb-scrub { border-top: 1px solid var(--line); padding: 30px 22px 30px; position: relative; }
.pb-track { position: relative; height: 56px; cursor: ew-resize; touch-action: none; outline: none; border-radius: 3px; }
.pb-track canvas { display: block; width: 100%; height: 100%; border-radius: 3px; }
.pb-track:focus-visible { box-shadow: 0 0 0 1px var(--ink); }
.pb-thumb { position: absolute; top: -8px; bottom: -8px; width: 2px; margin-left: -1px; background: var(--ink); pointer-events: none; }
.pb-thumb span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 500 11px var(--f-mono); color: var(--ink); padding-bottom: 3px; }
.pb-yrs { position: relative; height: 14px; margin-top: 6px; }
.pb-yrs span { position: absolute; transform: translateX(-50%); font: 500 10px var(--f-mono); color: var(--ink3); }
.pb-note { padding: 0 22px 18px; font-size: 12.5px; color: var(--ink3); }

/* ── C 問答 ── */
.pc { background: #0B0B0C; padding: 26px 28px 30px; display: flex; flex-direction: column; gap: 18px; }
.pc-in { max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.pc-ask { display: flex; gap: 10px; border-bottom: 1px solid var(--line2); padding-bottom: 10px; }
.pc-ask input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--ink); font: 500 clamp(17px, 2.2vw, 22px)/1.4 var(--f-sans); padding: 6px 0; }
.pc-ask input::placeholder { color: var(--ink3); }
.pc-ask:focus-within { border-color: var(--ink); }
.pc-ask button { font: 500 12px var(--f-mono); background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 0 16px; cursor: pointer; flex: none; }
.pc-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pc-chip { font: 500 13px var(--f-sans); color: var(--ink2); background: transparent; border: 1px solid var(--line2); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.pc-chip:hover, .pc-chip.on { color: var(--ink); border-color: var(--ink2); }
.pc-chip:focus-visible, .pc-ask button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
.pc-old { display: flex; gap: 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; color: inherit; font: inherit; }
.pc-old .q { color: var(--ink2); font-size: 13.5px; flex: none; }
.pc-old .a { color: var(--ink3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pc-card { border-top: 1px solid var(--line2); padding-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.pc-q { font: 500 12px var(--f-mono); color: var(--ink3); letter-spacing: .04em; }
.pc-a { font-size: clamp(16px, 1.75vw, 19px); line-height: 1.85; color: var(--ink); }
.pc-a .snt { transition: opacity .35s; }
.pc-card.typing .snt { opacity: 0; }
.pc-card.typing .snt.in { opacity: 1; }
.pc-ev { display: grid; gap: 14px; transition: opacity .4s; }
.pc-ev.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pc-card.typing .pc-ev { opacity: 0; }
.pc-ev figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 8px; background: var(--panel); min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.pc-next { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* 比較 */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 12px 16px 12px 0; border-top: 1px solid var(--line); color: var(--ink2); }
thead th { font: 500 11.5px var(--f-mono); letter-spacing: .06em; color: var(--ink3); border-top: 1px solid var(--line2); }
tbody th { color: var(--ink); font-weight: 600; white-space: nowrap; }
.rec { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; }
ol.steps li { counter-increment: s; padding: 12px 0 12px 34px; border-top: 1px solid var(--line); position: relative; color: var(--ink2); }
ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 13px; font: 500 12px var(--f-mono); color: var(--brand); }
ol.steps li b { color: var(--ink); font-weight: 600; }
.foot { color: var(--ink3); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 860px) {
  .wrap { gap: 56px; padding-block: 36px 72px; }
  .stats, .mech { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats div:nth-child(3), .mech div:nth-child(3) { padding-left: 0; border-left: 0; }
  .stats div:nth-child(n+3), .mech div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .two, .rec, .fit, .pa-main, .pb-main { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .pb-main { gap: 0; }
  .pb-side { border-left: 0; border-top: 1px solid var(--line); }
  .pa, .pc { padding: 18px 16px 20px; }
  .dir-h { grid-template-columns: minmax(0, 1fr); } .dir-h p, .try { grid-column: 1; }
  .pc-ev.two { grid-template-columns: minmax(0, 1fr); }
  .pb-dial .stl { font-size: 20px; } .pb-dial .yr { display: none; } .pb-dial .c-sm { font-size: 17px; } .pb-dial .c-px { font-size: 44px; }
  .pb-top, .pb-scrub { padding-left: 16px; padding-right: 16px; } .pb-row { padding: 10px 16px; } .pb-note { padding: 0 16px 16px; }
}
/* ── 第二輪：三種視覺語言（全寬場景，同一個首頁第一屏做三次） ── */
.wrap-top { padding-bottom: 0; }
.vd { display: flex; flex-direction: column; gap: 22px; padding-top: 76px; }
.vin { max-width: 1180px; width: 100%; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.scene { position: relative; width: 100%; overflow: hidden; border-block: 1px solid var(--line2); }
.after4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.after4 div { border-top: 1px solid var(--line); padding-top: 12px; color: var(--ink2); font-size: 14px; }
.after4 b { display: block; color: var(--ink); font: 500 11.5px/1.6 var(--f-mono); letter-spacing: .06em; margin-bottom: 2px; }
.done { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line2); }
.done div { padding: 16px 20px 0 0; color: var(--ink2); font-size: 14px; }
.done div + div { padding-left: 20px; border-left: 1px solid var(--line); }
.done b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.sep { border: 0; border-top: 1px solid var(--line2); margin: 0; }

/* 1 網點 */
.n1 { background: #070707; padding: 22px clamp(16px, 4vw, 56px) 26px; display: flex; flex-direction: column; gap: 14px; }
.n1-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.n1-hl { font: 900 clamp(20px, 2.6vw, 34px)/1.3 "Noto Sans TC", sans-serif; max-width: 24em; text-wrap: balance; }
.n1-hl em, .n2-hl em { font-style: normal; }
.n1-hl em { color: var(--brand); }
.n1-box { position: relative; height: clamp(180px, 31vw, 420px); touch-action: pan-y; cursor: crosshair; }
.n1-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.n1-read { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; border-top: 1px solid var(--line2); padding-top: 10px; font: 500 13px var(--f-mono); color: var(--ink); }
.n1-read .hint { margin-left: auto; color: var(--ink3); font-size: 11.5px; letter-spacing: .04em; }
.n1-figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.n1-fig { padding: 6px 18px 0 0; min-width: 0; }
.n1-fig + .n1-fig { padding-left: 18px; border-left: 1px solid var(--line); }
.n1-fig b { display: block; font: 900 clamp(30px, 4.4vw, 58px)/1.05 Archivo, "Arial Narrow", sans-serif; font-stretch: 62%; }
.n1-fig span { font-size: 12.5px; color: var(--ink2); }

/* 2 晨線 */
.n2 { height: clamp(500px, 54vw, 720px); user-select: none; -webkit-user-select: none; --x: 78%; --s: 60px; }
.n2-l { position: absolute; inset: 0; padding: 22px clamp(16px, 4vw, 56px) 104px; display: flex; flex-direction: column; background: var(--b); color: var(--k); }
.n2-l.night { --b: #0C0C0D; --k: #F2F0EA; --k2: #A9A59C; --k3: #77736B; --ln: #2A2A2F; --r: #FF4A2E; }
.n2-l.day { --b: #EEECE6; --k: #0E0E0F; --k2: #55514A; --k3: #8B867C; --ln: #CFCBC1; --r: #FF3B1F; clip-path: polygon(calc(var(--x) + var(--s)) 0, 100% 0, 100% 100%, calc(var(--x) - var(--s)) 100%); }
.n2-top { display: flex; gap: 20px; justify-content: space-between; flex-wrap: wrap; font: 500 11.5px var(--f-mono); letter-spacing: .06em; color: var(--k3); border-bottom: 1px solid var(--ln); padding-bottom: 12px; }
.n2-hl { font: 900 clamp(20px, 2.7vw, 36px)/1.35 var(--f-serif); max-width: 15em; margin-top: 22px; text-wrap: balance; transition: opacity .3s; }
.n2-hl em { color: var(--r); }
.n2-px { margin-top: auto; text-align: right; font: 900 clamp(76px, 17vw, 250px)/.9 "Bodoni Moda", "Noto Sans TC", sans-serif; letter-spacing: -.02em; font-variant-numeric: lining-nums; white-space: nowrap; }
.n2-px small { font-size: .34em; vertical-align: 1em; font-weight: 500; margin-right: .1em; color: var(--k2); }
.n2-meta { display: flex; justify-content: flex-end; gap: 18px; align-items: baseline; flex-wrap: wrap; margin-top: 16px; font: 500 12px var(--f-mono); color: var(--k2); }
.n2-meta b { font: 900 22px var(--f-serif); color: var(--k); letter-spacing: .12em; }
.n2-ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.n2-ov .hit { pointer-events: stroke; cursor: ew-resize; touch-action: none; }
.n2-ov .hd { pointer-events: all; cursor: ew-resize; touch-action: none; }
.n2-lab { position: absolute; top: 0; left: 0; white-space: nowrap; font: 600 12px var(--f-sans); color: #141414; background: var(--brand); padding: 4px 10px; border-radius: 999px; pointer-events: none; }
.n2-scrub { position: absolute; left: clamp(16px, 4vw, 56px); right: clamp(16px, 4vw, 56px); bottom: 20px; height: 62px; mix-blend-mode: difference; color: #fff; cursor: ew-resize; touch-action: none; outline: none; }
.n2-scrub svg { display: block; width: 100%; height: 40px; }
.n2-scrub .yrs { position: relative; height: 14px; margin-top: 6px; }
.n2-scrub .yrs span { position: absolute; transform: translateX(-50%); font: 500 10px var(--f-mono); }
.n2-scrub:focus-visible { box-shadow: 0 0 0 1px #fff; }
.n2-th { position: absolute; bottom: 36px; height: 52px; width: 2px; margin-left: -1px; background: var(--brand); pointer-events: none; }
.n2-th span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 500 10.5px var(--f-mono); color: var(--brand); padding-bottom: 2px; }

/* 3 儀表 */
.n3 { background: #090A0C; padding: 18px clamp(16px, 3vw, 40px) 22px; --hair: #1F2227; }
.n3-bar { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 12px; }
.n3-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; }
.n3-m { position: relative; border: 1px solid var(--hair); padding: 14px 16px; min-width: 0; background: #0B0C0F; text-align: left; color: inherit; font: inherit; }
.n3-m::before, .n3-m::after { content: ""; position: absolute; width: 9px; height: 9px; border: 1px solid var(--ink3); pointer-events: none; transition: border-color .2s; }
.n3-m::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.n3-m::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
.n3-main { grid-column: 1 / span 8; padding: 12px 8px 4px 12px; outline: none; }
.n3-main:focus-visible { border-color: var(--ink3); }
.n3-read { grid-column: 9 / span 4; display: flex; flex-direction: column; gap: 12px; }
.n3-s { grid-column: span 2; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.n3-s:hover { border-color: var(--line2); }
.n3-s:focus-visible { outline: 1px solid var(--ink2); outline-offset: 2px; }
.n3-s.on::before, .n3-s.on::after { border-color: var(--brand); }
.n3-s.on .lb { color: var(--ink); }
.n3 .lb { font: 500 10.5px var(--f-mono); letter-spacing: .08em; color: var(--ink3); text-transform: uppercase; }
.n3-px { font: 300 clamp(44px, 6vw, 82px)/1 var(--f-sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.n3-st { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.n3-st b { font: 600 20px var(--f-sans); letter-spacing: .1em; }
.n3-st span { font: 500 12px var(--f-mono); color: var(--ink2); }
.n3-hl { margin-top: auto; border-top: 1px solid var(--hair); padding-top: 12px; font-size: 13.5px; color: var(--ink2); }
.n3-s .val { font: 400 26px/1.1 var(--f-sans); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.n3-s .wd { font-size: 12px; min-height: 1.5em; }
.n3-s svg { display: block; margin-top: 2px; }
.odo { display: inline-flex; align-items: flex-end; line-height: 1; }
.odo .od { display: inline-block; height: 1em; line-height: 1; overflow: hidden; }
.odo .odc { display: block; transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.odo .odc i { display: block; height: 1em; line-height: 1; font-style: normal; }
.odo .oc { line-height: 1; }
#n3-ch svg { display: block; }
#n3-ch text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink3); }

@media (max-width: 860px) {
  .vd { padding-top: 56px; }
  .after4, .done { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .after4 div { margin-top: 14px; }
  .done div, .done div + div { padding: 14px 0 0; border-left: 0; }
  .n1-figs { grid-template-columns: minmax(0, 1fr); gap: 10px; } .n1-fig + .n1-fig { padding-left: 0; border-left: 0; }
  .n1-read .hint { margin-left: 0; }
  .n2-top .nav, .n1-nav { display: none; }
  .n2-meta { justify-content: flex-start; }
  .n3-main, .n3-read { grid-column: 1 / -1; }
  .n3-s { grid-column: span 6; }
}

/* ── 第三輪：五套全新的 VI。同一塊內容、同一組資料，換五種視覺。線、柱、刻度一律是向量，讀值精確 ── */
.vi { padding: 20px clamp(16px, 3.2vw, 44px) 26px; background: var(--v-bg); color: var(--v-ink); font-family: var(--v-f); position: relative; --v-r: 0px; --v-gap: 12px; --v-cr: 999px; }
.vi-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; position: relative; }
.vi-wm { font: var(--v-wm); letter-spacing: var(--v-wms, .24em); }
.vi-nav { display: flex; gap: 20px; font-size: 12.5px; color: var(--v-ink2); }
.vi-nav b { color: var(--v-ink); font-weight: 500; }
.vi-stt { font: 500 11px var(--f-mono); color: var(--v-ink2); letter-spacing: .06em; }
.vi-stt i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--v-up); margin-right: 6px; vertical-align: 1px; }
.vi-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--v-gap); position: relative; }
.vi-hero { grid-column: 1 / span 5; grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.vi-card, .vi-stat { background: var(--v-panel); border: var(--v-bd); border-radius: var(--v-r); min-width: 0; position: relative; }
.vi-card { padding: 16px 18px 12px; }
.vi-c1 { grid-column: 6 / span 7; } .vi-c2 { grid-column: 6 / span 4; } .vi-spec { grid-column: 10 / span 3; }
.vi-lb { font: 500 11px var(--f-mono); letter-spacing: .08em; color: var(--v-ink2); text-transform: uppercase; }
.vi-num { font: var(--v-num); line-height: 1; letter-spacing: var(--v-nls, -.02em); font-variant-numeric: tabular-nums; white-space: nowrap; }
.vi-sub { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--v-ink2); }
.vi-chg { color: var(--v-up); font: 600 15px var(--f-mono); }
.vi-chip { padding: 3px 11px; border-radius: var(--v-cr); background: var(--v-chipbg); color: var(--v-chipfg); font-weight: 600; font-size: 12.5px; letter-spacing: .08em; }
.vi-lead { font-size: 14px; color: var(--v-ink2); max-width: 30em; }
.vi-cl { list-style: none; margin: 4px 0 0; padding: 0; counter-reset: c; border-top: 1px solid var(--v-line); }
.vi-cl li { counter-increment: c; display: flex; gap: 14px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--v-line); font-size: 14.5px; font-weight: 500; }
.vi-cl li::before { content: "0" counter(c); font: 500 11px var(--f-mono); color: var(--v-acc); }
.vi-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--v-gap); margin-top: auto; }
.vi-stat { padding: 12px 14px; }
.vi-stat b { display: block; font: var(--v-sn); font-variant-numeric: tabular-nums; }
.vi-stat span { font-size: 12px; color: var(--v-ink2); }
.vi-chh { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; margin-bottom: 6px; }
.vi-ro { font: 500 11.5px var(--f-mono); color: var(--v-ink2); }
.vi-ro b { color: var(--v-ink); font-weight: 500; }
.vi svg { display: block; overflow: visible; }
.vi svg text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--v-ink2); }
.vi svg text.el { font-family: var(--v-f); font-size: 11.5px; font-weight: 600; }
.vi-sw { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 10px 0 14px; }
.vi-sw i { display: block; aspect-ratio: 1; border-radius: var(--v-sr, 4px); border: 1px solid var(--v-line); }
.vi-ty { font: var(--v-sn); }
.vi-ty small { display: block; font: 500 11px var(--f-mono); color: var(--v-ink2); margin-top: 4px; letter-spacing: 0; }
.vi-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.vi-chips span { font-size: 12px; padding: 3px 10px; border-radius: var(--v-cr); border: 1px solid currentColor; }
.vi-dot { position: relative; height: clamp(96px, 13.5vw, 172px); cursor: crosshair; touch-action: pan-y; }
.vi-dot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* 1 點陣：顯示牆。黑、白色光點、萊姆綠 */
.vi1 { --v-bg: #050505; --v-panel: #0A0A0A; --v-bd: 1px solid #1D1D1D; --v-line: #2A2A2A; --v-grid: #3A3A3A; --v-ink: #F2F2EE; --v-ink2: #8C8C87; --v-acc: #C6FF3D; --v-up: #C6FF3D; --v-down: #FF4D4D; --c-px: #F2F2EE; --c-a: #C6FF3D; --c-b: #8C8C87; --hlA: #F2F2EE; --hlB: #C6FF3D; --v-dim: #2C2C2C;
  --v-f: "Geist", "Noto Sans TC", sans-serif; --v-sn: 500 24px/1.2 "Geist Mono", monospace; --v-wm: 600 13px "Geist Mono", monospace; --v-chipbg: #C6FF3D; --v-chipfg: #050505; --v-cr: 2px; --v-sr: 50%;
  background-image: radial-gradient(#171717 1px, transparent 1.3px); background-size: 10px 10px; }
/* 2 光譜：深色玻璃，五個階段色連成一道光 */
.vi2 { --v-bg: #05060A; --v-panel: rgba(255, 255, 255, .035); --v-bd: 1px solid rgba(255, 255, 255, .09); --v-line: rgba(255, 255, 255, .12); --v-grid: rgba(255, 255, 255, .07); --v-ink: #F4F6FF; --v-ink2: #8E93A8; --v-acc: #38D6E8; --v-up: #3BE39A; --v-down: #FF5C7A; --c-px: #38D6E8; --c-a: #F4F6FF; --c-b: #8E93A8; --hlA: #F7C948; --hlB: #3BE39A; --v-dim: rgba(255, 255, 255, .13);
  --v-f: "Sora", "Noto Sans TC", sans-serif; --v-num: 200 clamp(60px, 8.6vw, 124px) "Sora", sans-serif; --v-nls: -.045em; --v-sn: 300 26px/1.2 "Sora", sans-serif; --v-wm: 600 13px "Sora", sans-serif; --v-wms: .34em; --v-r: 18px; --v-chipbg: rgba(59, 227, 154, .15); --v-chipfg: #3BE39A; --v-sr: 8px;
  --sp: linear-gradient(90deg, #5B7CFF, #38D6E8 30%, #3BE39A 55%, #F7C948 80%, #FF5C7A); }
.vi2::before { content: ""; position: absolute; inset: 0 0 auto; height: 220px; pointer-events: none; background: radial-gradient(46% 150px at 22% 0, rgba(91, 124, 255, .2), transparent 70%), radial-gradient(40% 120px at 74% 0, rgba(59, 227, 154, .11), transparent 70%); }
.vi2 .vi-num { background: var(--sp); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .06em; width: fit-content; }
.vi2 .vi-wm { background: var(--sp); -webkit-background-clip: text; background-clip: text; color: transparent; }
/* 3 航電：抬頭顯示器。單色冰藍，琥珀色警示 */
.vi3 { --v-bg: #02060A; --v-panel: rgba(138, 243, 255, .025); --v-bd: 1px solid rgba(138, 243, 255, .26); --v-line: rgba(138, 243, 255, .3); --v-grid: rgba(138, 243, 255, .13); --v-ink: #D8FBFF; --v-ink2: #5E8F99; --v-acc: #8AF3FF; --v-up: #5CFFB1; --v-down: #FF5470; --c-px: #8AF3FF; --c-a: #FFB020; --c-b: #5E8F99; --hlA: #FFB020; --hlB: #5CFFB1; --v-dim: rgba(138, 243, 255, .22);
  --v-f: "Chakra Petch", "Noto Sans TC", sans-serif; --v-num: 600 clamp(60px, 8.8vw, 122px) "Chakra Petch", sans-serif; --v-nls: .01em; --v-sn: 500 26px/1.2 "Chakra Petch", sans-serif; --v-wm: 600 14px "Chakra Petch", sans-serif; --v-wms: .4em; --v-chipbg: transparent; --v-chipfg: #8AF3FF; --v-cr: 0px; --v-sr: 0px;
  background-image: linear-gradient(rgba(138, 243, 255, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(138, 243, 255, .045) 1px, transparent 1px); background-size: 32px 32px; }
.vi3 .vi-num { color: var(--v-acc); text-shadow: 0 0 22px rgba(138, 243, 255, .32); }
.vi3 .vi-chip { border: 1px solid var(--v-acc); }
.vi3 .vi-card::before, .vi3 .vi-card::after, .vi3 .vi-stat::before, .vi3 .vi-stat::after { content: ""; position: absolute; width: 10px; height: 10px; border: 2px solid var(--v-acc); pointer-events: none; }
.vi3 .vi-card::before, .vi3 .vi-stat::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.vi3 .vi-card::after, .vi3 .vi-stat::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
/* 4 無塵室：明亮、極細的字、大圓角 */
.vi4 { --v-bg: #ECEFF3; --v-panel: #FFFFFF; --v-bd: 1px solid #E0E4EA; --v-line: #D5DAE1; --v-grid: #E7EAEF; --v-ink: #0A0C10; --v-ink2: #6A7280; --v-acc: #2F54FF; --v-up: #00A870; --v-down: #F0364A; --c-px: #0A0C10; --c-a: #2F54FF; --c-b: #9CA4B0; --hlA: #2F54FF; --hlB: #00A870; --v-dim: #DCE0E6;
  --v-f: "Inter Tight", "Noto Sans TC", sans-serif; --v-num: 200 clamp(66px, 9.6vw, 138px) "Inter Tight", sans-serif; --v-nls: -.05em; --v-sn: 300 28px/1.2 "Inter Tight", sans-serif; --v-wm: 600 13px "Inter Tight", sans-serif; --v-wms: .3em; --v-r: 22px; --v-chipbg: #0A0C10; --v-chipfg: #FFFFFF; --v-sr: 50%; }
/* 5 霓虹：深藍底，青、桃紅、萊姆三個螢光色 */
.vi5 { --v-bg: #060A1C; --v-panel: #0B1130; --v-bd: 1px solid rgba(0, 229, 255, .2); --v-line: rgba(0, 229, 255, .28); --v-grid: rgba(133, 144, 184, .16); --v-ink: #EAF0FF; --v-ink2: #8590B8; --v-acc: #00E5FF; --v-up: #D7FF3E; --v-down: #FF2E88; --c-px: #00E5FF; --c-a: #FF2E88; --c-b: #D7FF3E; --hlA: #FF2E88; --hlB: #D7FF3E; --v-dim: rgba(133, 144, 184, .28);
  --v-f: "Geist", "Noto Sans TC", sans-serif; --v-num: 800 clamp(46px, 6.9vw, 100px) "Unbounded", sans-serif; --v-nls: -.035em; --v-sn: 700 21px/1.25 "Unbounded", sans-serif; --v-wm: 800 13px "Unbounded", sans-serif; --v-wms: .14em; --v-r: 6px; --v-chipbg: #D7FF3E; --v-chipfg: #060A1C; --v-cr: 4px; --v-sr: 4px; }
.vi5 .vi-num::after { content: ""; display: block; width: 1.9em; height: .075em; margin-top: .14em; background: linear-gradient(90deg, #00E5FF, #FF2E88); }

.vsum { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line2); }
.vsum a { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 0 0; color: var(--ink2); font-size: 13.5px; text-decoration: none; }
.vsum a + a { padding-left: 16px; border-left: 1px solid var(--line); }
.vsum b { color: var(--ink); font: 900 18px/1.4 var(--f-serif); }
.vsum a:hover b { color: var(--brand); }
.vsum a:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

@media (max-width: 860px) {
  .vi-hero, .vi-c1, .vi-c2, .vi-spec { grid-column: 1 / -1; grid-row: auto; }
  .vi-nav { display: none; }
  .vi-stats { grid-template-columns: minmax(0, 1fr); }
  .vsum { grid-template-columns: minmax(0, 1fr); }
  .vsum a, .vsum a + a { padding: 12px 0 0; border-left: 0; }
}

/* ── 第四輪：四個整站概念。每個都是「結構＋互動＋視覺」一起換，不是同一個版面換皮 ── */
.pr4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line2); }
.pr4 div { padding: 16px 18px 0 0; color: var(--ink2); font-size: 14px; }
.pr4 div + div { padding-left: 18px; border-left: 1px solid var(--line); }
.pr4 b { display: block; color: var(--ink); font: 900 17px/1.5 var(--f-serif); margin-bottom: 2px; }
.hbtn { font: 500 12px var(--f-mono); letter-spacing: .04em; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 999px; padding: 7px 14px; cursor: pointer; opacity: .8; }
.hbtn:hover { opacity: 1; } .hbtn:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }

/* 1 牆 */
.h1 { background: #040404; color: #F2F2EE; }
.h1-box { position: relative; height: clamp(520px, 46vw, 640px); cursor: pointer; touch-action: pan-y; }
.h1-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.h1-lab span { position: absolute; font: 500 11px var(--f-mono); letter-spacing: .1em; color: #8C8C87; pointer-events: none; transition: color .2s; }
.h1-lab span.on { color: #C6FF3D; }
.h1-ov { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .5s .25s; pointer-events: none; }
.h1.focus .h1-ov { opacity: 1; pointer-events: auto; }
.h1-ov text { font: 500 11px var(--f-mono); fill: #8C8C87; }

/* 2 單幀 */

.h2-ui { position: absolute; left: clamp(14px, 2.4vw, 34px); right: clamp(14px, 2.4vw, 34px); bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 5; pointer-events: none; }

/* 3 地層 */
.h3 { background: #08080A; color: #F1EFEA; padding: 18px clamp(16px, 3vw, 40px) 20px; display: flex; flex-direction: column; gap: 12px; height: clamp(560px, 58vw, 760px); font-family: "Inter Tight", "Noto Sans TC", sans-serif; }

.h3-st { flex: 1; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.h3-b { flex: var(--g, 1) 1 0; min-height: 18px; background: var(--c, #232326); transition: flex-grow .55s cubic-bezier(.2, .8, .2, 1), background-color .55s; position: relative; overflow: hidden; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; display: block; width: 100%; }

.h3-tr { position: relative; height: 34px; cursor: ew-resize; touch-action: none; outline: none; border-top: 1px solid #2A2A2E; }

/* 4 空間 */
.h4 { background: #E7E8EA; color: #0D0E10; height: clamp(520px, 56vw, 760px); font-family: "Inter Tight", "Noto Sans TC", sans-serif; }

.h4-p .big { font-weight: 200; font-size: clamp(34px, 6.2vw, 96px); line-height: 1; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }

.h4-ui { position: absolute; left: clamp(14px, 2.4vw, 34px); right: clamp(14px, 2.4vw, 34px); bottom: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 30; pointer-events: none; }

}

/* ── 整合方案（第六輪）：空間排列三種、配色五套各有深淺。所有顏色走 .lvw 上的變數，切換時整個原型和圖表樣張一起換 ── */
.lvw { --bg: #060607; --sheet: #0E0E10; --ink: #EDEDE8; --k2: #8F8F8A; --ac: #C6FF3D; --up: #C6FF3D; --dn: #FF5A4D; --c3: #8C9BFF; --c4: #FFB454; --c5: #5CE1E6; --shim: #FFFFFF; --shadow: #000; }
.lv-sw { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding-bottom: 14px; }
.lv-sw .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lv-sw .grp > .mono { margin-right: 4px; }
.pchip { font: 500 13px var(--f-sans); color: var(--ink2, #B4B0A7); background: transparent; border: 1px solid #36363D; border-radius: 999px; padding: 6px 12px 6px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.pchip i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.pchip[aria-pressed="true"] { color: #0A0A0B; background: #EFECE5; border-color: #EFECE5; }
.pchip:focus-visible { outline: 1px solid #EFECE5; outline-offset: 2px; }
.pnote { color: #B4B0A7; font-size: 13.5px; padding-bottom: 12px; min-height: 2.6em; }
.lv { background: var(--bg); color: var(--ink); height: clamp(640px, 62vw, 880px); font-family: "Inter Tight", "Noto Sans TC", sans-serif; transition: background-color .5s, color .5s; }
.lv-f { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lv-top { position: absolute; left: clamp(16px, 2.6vw, 36px); right: clamp(16px, 2.6vw, 36px); top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 40; font: 500 11.5px var(--f-mono); letter-spacing: .1em; color: var(--k2); pointer-events: none; }
.lv-top b { color: var(--ink); font-weight: 500; letter-spacing: .3em; }
.lv-top b::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--ac); margin-right: 10px; vertical-align: -1px; }
.sh.front::before { background: linear-gradient(90deg, transparent, var(--ac), transparent); left: 22%; right: 22%; }
.lv-top .live i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--up); margin-right: 8px; vertical-align: 1px; animation: lvbeat 3s ease-in-out infinite; }
.lv-st { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 40%; }
.sh { position: absolute; left: 25%; top: 21%; width: 50%; aspect-ratio: 16 / 9.8; container-type: inline-size; background: var(--sheet); border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 16px; box-shadow: 0 60px 100px -50px var(--shadow); cursor: pointer; overflow: hidden; outline: none;
  transition: transform .9s cubic-bezier(.2, .8, .2, 1), opacity .6s, left .9s cubic-bezier(.2, .8, .2, 1), top .9s cubic-bezier(.2, .8, .2, 1), width .9s cubic-bezier(.2, .8, .2, 1), height .9s cubic-bezier(.2, .8, .2, 1), border-radius .9s, filter .6s, background-color .5s; }
.lv.stack .sh { left: 19%; top: 27%; width: 62%; aspect-ratio: 16 / 9.6; }
.sh::before { content: ""; position: absolute; left: 10%; right: 10%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 55%, transparent), transparent); z-index: 2; }
.sh:focus-visible { border-color: color-mix(in srgb, var(--ink) 60%, transparent); }
.lv.flat .sh.front { left: 0; top: 0; width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; cursor: default; border-color: transparent; }
.sh-in { position: absolute; inset: 0; padding: 3.2cqw 3.6cqw 2.4cqw; display: flex; flex-direction: column; gap: 1.6cqw; animation: lvdrift 9s ease-in-out infinite; animation-delay: var(--dl, 0s); }
.lv.flat .sh-in { animation: none; padding-top: max(52px, 4.4cqw); padding-bottom: 66px; }
.sh-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 max(10px, 1.25cqw) var(--f-mono); letter-spacing: .12em; color: var(--k2); white-space: nowrap; }
.sh-h .v { color: var(--ink); letter-spacing: 0; }
.sh-b { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-rows: minmax(0, 1fr) auto; gap: 2cqw 4cqw; }
.sh-l { display: flex; flex-direction: column; gap: 1.5cqw; min-width: 0; }
.sh .big { font-family: var(--fn, inherit); font-weight: var(--fw, 400); font-stretch: var(--fst, 100%); font-size: 10.4cqw; line-height: 1; letter-spacing: var(--fls, -.05em); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sh-h .v { font-family: var(--fn, inherit); font-stretch: var(--fst, 100%); font-weight: 500; }
.sh .s { font-size: max(12px, 1.5cqw); line-height: 1.65; color: color-mix(in srgb, var(--ink) 68%, var(--sheet)); max-width: 26em; }
.sh .ro { margin-top: auto; font: 500 max(10px, 1.15cqw) var(--f-mono); color: var(--k2); }
.sh-m { min-width: 0; min-height: 0; position: relative; }
.sh-m svg, .ms svg { display: block; width: 100%; height: 100%; overflow: visible; }
.sh-m text { font: 500 10.5px var(--f-mono); fill: var(--k2); }
.sh-x { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.6cqw; border-top: 1px solid color-mix(in srgb, var(--ink) 9%, transparent); padding-top: 1.4cqw; }
.mini { background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 1.8cqw; align-items: center; padding: .7cqw; border-radius: 8px; min-width: 0; transition: background .2s; }
.mini:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.mini:focus-visible { outline: 1px solid color-mix(in srgb, var(--ink) 60%, transparent); }
.mk { font: 500 max(9.5px, 1.05cqw) var(--f-mono); letter-spacing: .08em; color: var(--k2); white-space: nowrap; }
.mv { grid-row: 2; font-family: var(--fn, inherit); font-stretch: var(--fst, 100%); font-weight: var(--fw, 400); font-size: max(14px, 2.3cqw); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ms { grid-row: 1 / span 2; grid-column: 2; height: max(30px, 4.6cqw); min-width: 0; }
.lv .shim { fill: none; stroke: var(--shim); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 55 945; stroke-dashoffset: 1000; animation: lvshim 6.5s linear infinite; }
.lv .pulse { fill: none; stroke: var(--ac); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: lvpulse 3s ease-out infinite; }
.lv-ui { position: absolute; left: clamp(16px, 2.6vw, 36px); right: clamp(16px, 2.6vw, 36px); bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 40; pointer-events: none; }
.lv-ui > * { pointer-events: auto; }
.lv-ui .nav { display: flex; gap: 8px; align-items: center; }
.lv-ui .mono { color: var(--k2); margin-left: 8px; }
@keyframes lvshim { to { stroke-dashoffset: 0; } }
@keyframes lvpulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(3.6); opacity: 0; } }
@keyframes lvdrift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.6cqw); } }
@keyframes lvbeat { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
@container (max-width: 520px) {
  .sh-b { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .sh .big { font-size: 15cqw; } .sh .s { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .sh .ro { margin-top: 0; }
  .ms { display: none; } .mini { grid-template-columns: minmax(0, 1fr); } .sh-in { padding: 16px 16px 14px; gap: 10px; }
}
/* 字與數字樣張 */
.ty3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.ty3 button { background: var(--sheet); color: var(--ink); border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 14px; padding: 14px 18px 16px; text-align: left; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 6px; font: inherit; overflow: hidden; }
.ty3 button[aria-pressed="true"] { border-color: var(--ac); }
.ty3 button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
.ty3 .t { font: 500 11px var(--f-mono); letter-spacing: .1em; color: var(--k2); }
.ty3 .n { font-family: var(--fn); font-stretch: var(--fst, 100%); font-size: clamp(38px, 5.4vw, 78px); line-height: 1; letter-spacing: var(--fls, -.05em); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ty3 .m { font-family: var(--fn); font-stretch: var(--fst, 100%); font-size: clamp(14px, 1.5vw, 19px); color: color-mix(in srgb, var(--ink) 75%, var(--sheet)); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 860px) { .ty3 { grid-template-columns: minmax(0, 1fr); } }
/* 圖表用色樣張 */
.cs { background: var(--bg); color: var(--ink); padding: 22px clamp(16px, 2.6vw, 36px) 26px; border-bottom: 1px solid #36363D; font-family: "Inter Tight", "Noto Sans TC", sans-serif; transition: background-color .5s, color .5s; display: flex; flex-direction: column; gap: 18px; }
.cs-g { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.cs-c { background: var(--sheet); border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 14px; padding: 14px 16px 12px; min-width: 0; display: flex; flex-direction: column; gap: 8px; transition: background-color .5s; }
.cs-c .t { font: 500 11px var(--f-mono); letter-spacing: .1em; color: var(--k2); }
.cs-c svg { display: block; overflow: visible; }
.cs-c text { font: 500 10.5px var(--f-mono); fill: var(--k2); }
.cs-c text.el { font: 600 11px "Inter Tight", "Noto Sans TC", sans-serif; }
.cs-sw { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.cs-sw span { display: inline-flex; align-items: center; gap: 7px; font: 500 11.5px var(--f-mono); color: var(--k2); }
.cs-sw i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); display: inline-block; }
.stg5 { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--k2); }
.stg5 span { display: inline-flex; align-items: center; gap: 5px; }
.stg5 i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.mv5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line2); }
.mv5 div { padding: 16px 16px 0 0; color: var(--ink2); font-size: 13.5px; }
.mv5 div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.mv5 b { display: block; color: var(--ink); font-weight: 600; font-size: 14.5px; margin-bottom: 2px; }
@media (max-width: 1000px) { .cs-g { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .sh, .lv.stack .sh { left: 6%; width: 88%; top: 28%; aspect-ratio: 4 / 4.4; }
  .lv { height: 740px; }
  .lv-ui .mono { display: none; }
  .mv5 { grid-template-columns: minmax(0, 1fr); } .mv5 div, .mv5 div + div { padding: 12px 0 0; border-left: 0; }
  .cs-g { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .lv .shim { display: none; } .lv .pulse, .sh-in, .lv-top .live i { animation: none; } }

/* ── 鏈上內頁：一個領域裡再分五片（總覽＋四個問題）。每一片是一張主圖加佐證，全部共用一條時間游標 ── */
.oc { background: var(--bg); color: var(--ink); height: clamp(720px, 68vw, 960px); font-family: "Inter Tight", "Noto Sans TC", sans-serif; transition: background-color .5s, color .5s; }
.oc-f { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.oc-top { position: absolute; left: clamp(16px, 2.4vw, 34px); right: clamp(16px, 2.4vw, 34px); top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 40; font: 500 11.5px var(--f-mono); letter-spacing: .1em; color: var(--k2); }
.oc-top b { color: var(--ink); font-weight: 500; letter-spacing: .3em; }
.oc-top b::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--ac); margin-right: 10px; vertical-align: -1px; }
.oc-top .r { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.oc-top .live i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--up); margin-right: 8px; vertical-align: 1px; animation: lvbeat 3s ease-in-out infinite; }

@property --vr { syntax: '<length>'; inherits: false; initial-value: 0px; }

:root[data-vt]::view-transition-new(root) { -webkit-mask-image: radial-gradient(circle at var(--vx) var(--vy), #000 calc(var(--vr) - 54px), transparent calc(var(--vr) - 2px)); mask-image: radial-gradient(circle at var(--vx) var(--vy), #000 calc(var(--vr) - 54px), transparent calc(var(--vr) - 2px)); }
:root[data-vt]::view-transition-image-pair(root) { background: radial-gradient(circle at var(--vx) var(--vy), #FFE9CF, #FFC58A 28%, #FF8A45 60%, #E0561F); }

.ov.mp { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 2.6cqw; }

.oc .pm-top { min-height: 26px; }

.oc .pm-r { color: var(--k2); font-size: 12px; } .oc .pm-r b { color: var(--ink); font-size: 14px; } .oc .pm-r i { background: color-mix(in srgb, var(--ink) 22%, transparent); }
.oc .pm-g button { color: var(--k2); } .oc .pm-g button[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 28%, transparent); }

@container (max-width: 560px) { .ov.mp { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } .ov.mp .ov-ls, .ov.mp .ov-lead { display: none; } .ol-pr { display: none; } }

}

@media (max-width: 760px) { .oc.cmp { grid-template-columns: minmax(0, 1fr); } .cmp .ol-c { height: 260px; } }
/* ══ 第十輪：平鋪。頭部一張卡，下面每個小問題一段，所有圖完整畫出 ══ */

.fs { scroll-margin-top: 104px; display: flex; flex-direction: column; gap: 14px; }

.fg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fc { container-type: inline-size; min-width: 0; background: var(--sheet); border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 14px; padding: 16px 18px 12px; box-shadow: 0 30px 60px -44px var(--shadow); transition: background-color .5s, border-color .3s; }
.fc:hover { border-color: color-mix(in srgb, var(--ink) 22%, transparent); }
.fc .ol { gap: 8px; height: 100%; }
.fc .ol-big { font-size: clamp(30px, 7.2cqw, 44px); }
.fc .ol-d { display: block; font-size: 13px; line-height: 1.65; max-width: none; }
.fc .ol-lg { font-size: 11.5px; gap: 3px 14px; }
.fc .ol-pr { display: flex; font-size: 11.5px; }
.fc .ol-c { height: 290px; flex: none; }
.fc .ol-na { min-height: 240px; }
.ol-t .md + .md { margin-left: 4px; }
.fx-b { margin-left: auto; flex: none; font: 500 10.5px var(--f-mono); letter-spacing: .05em; color: var(--k2); background: none; border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); border-radius: 999px; padding: 3px 10px; cursor: pointer; transition: color .2s, border-color .2s; }
.fx-b:hover { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 44%, transparent); }
.oc .oc-ft { position: static; left: auto; right: auto; bottom: auto; display: flex; justify-content: space-between; gap: 16px; padding: 6px clamp(16px, 2.4vw, 34px) 26px; }
.oc-fx { position: fixed; inset: 0; z-index: 90; background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.oc-fx[hidden] { display: none; }
.oc-fx .os { position: absolute; left: 50%; top: 50%; width: min(1200px, 94vw); height: min(740px, 90vh); transform: translate(-50%, -50%); filter: none; }
.oc-fx .rg { margin-left: auto; }
.fx-x { flex: none; margin-left: 10px; font: 500 11px var(--f-mono); color: var(--ink); background: none; border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
@media (max-width: 860px) {
  .oc-bar .oc-top { align-items: flex-start; }
  .oc-l { flex-direction: column; align-items: flex-start; gap: 4px; flex: 1; }

  .fg { grid-template-columns: minmax(0, 1fr); } .fs-h { flex-wrap: wrap; row-gap: 2px; } .fs-h h3 { font-size: 20px; } .fs-h .sub { flex-basis: 100%; order: 3; }

}
/* 圖名是標題，不是小字 */
h4.ol-n { margin: 0; font: 600 max(16px, 1.55cqw)/1.3 "Inter Tight", "Noto Sans TC", sans-serif; letter-spacing: 0; color: var(--ink); min-width: 0; }
.fc h4.ol-n { font-size: 17px; }
.ol-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.ol-ctl .md { flex-wrap: wrap; flex: 0 1 auto; min-width: 0; max-width: 100%; }
.ol-ctl .md + .md { margin-left: 0; padding-left: 10px; border-left: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); }
.ol-k { font: 500 max(10.5px, 1cqw) var(--f-mono); letter-spacing: .08em; color: var(--k2); margin-top: 4px; }
.fc .ol-k { font-size: 11px; }
.fc .ol-lg { font-size: 12px; }
.ol-lg span { white-space: normal; max-width: 100%; min-width: 0; } .ol-lg b { white-space: nowrap; }
@media (max-width: 860px) { .oc-b2 { flex-direction: row; align-items: center; } .oc-b2 .rg { align-self: center; padding-bottom: 0; } .fc h4.ol-n { font-size: 16.5px; } }
.ol-st { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 14px; font-size: max(12.5px, 1.2cqw); line-height: 1.5; color: var(--k2); }
.ol-st i { flex: none; width: 7px; height: 7px; border-radius: 50%; margin-right: -6px; }
.ol-st b { font-weight: 600; color: var(--ink); }
.ol-st span { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
.fc .ol-st { font-size: 13px; }
/* 熱力條（㉔）：一層一條色帶 */
.st { display: grid; gap: 4px; margin-top: 12px; }
.st-r { display: grid; grid-template-columns: minmax(64px, 108px) minmax(0, 1fr) 62px; align-items: center; column-gap: 10px; }
.st-l { font-size: var(--t-note); color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-s { display: block; width: 100%; height: 24px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 5%, transparent); }
.st-px { display: block; width: 100%; height: 62px; }
.st-v { font: 500 12.5px "Inter Tight", sans-serif; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* ══ 第十一輪：讀數清單、月度格子、週期儀 ══ */
.rl { display: flex; flex-direction: column; }
.rl-r { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; align-items: baseline; padding: 9px 0; border-top: 1px solid color-mix(in srgb, var(--ink) 9%, transparent); }
.rl-n { font-size: max(13.5px, 1.25cqw); color: var(--ink); }
.rl-v { font: 500 max(15px, 1.45cqw) "Inter Tight", "Noto Sans TC", sans-serif; font-variant-numeric: tabular-nums; color: var(--ink); }
.rl-b { grid-column: 1 / -1; position: relative; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 9%, transparent); }
.rl-b i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
.rl-b u { position: absolute; top: -3px; bottom: -3px; width: 1.5px; margin-left: -1.5px; background: var(--ink); opacity: .6; }
.rl-d { grid-column: 1 / -1; font-size: max(12px, 1.05cqw); line-height: 1.5; color: var(--k2); }
.fc .rl-n { font-size: 14px; } .fc .rl-v { font-size: 15.5px; } .fc .rl-d { font-size: 12px; }
.mg { overflow-x: auto; }
.mg table { width: 100%; min-width: 0; table-layout: fixed; border-collapse: separate; border-spacing: 2px; font: 500 10.5px var(--f-mono); font-variant-numeric: tabular-nums; }
.mg th { font-weight: 500; color: var(--k2); padding: 4px 2px; text-align: center; white-space: nowrap; }
.mg td { text-align: center; padding: 6px 0; border-radius: 3px; color: var(--ink); overflow: hidden; }
.mg th:first-child { width: 38px; }
.dl { height: 100%; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 2.2cqw; align-items: stretch; }
.dl-r { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
.dl-r svg { display: block; width: 100%; flex: 1; min-height: 0; overflow: visible; cursor: crosshair; }
.dl-r text { font: 500 10.5px var(--f-mono); fill: var(--k2); }
.dl-r text.mk { font: 500 10px "Inter Tight", "Noto Sans TC", sans-serif; }
.dl-r text.big { font: 600 15px "Inter Tight", "Noto Sans TC", sans-serif; }
.dl-rd { justify-content: center; min-height: 1.5em; font-size: max(11.5px, 1.02cqw); }
.dl-lg { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; font-size: max(11.5px, 1.02cqw); color: var(--k2); }
.dl-lg span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--ink); }
.dl-lg i { width: 7px; height: 7px; border-radius: 50%; }
.dl-lg em { font: 500 max(10.5px, .95cqw) var(--f-mono); font-style: normal; color: var(--k2); }
.dl-lg small { flex-basis: 100%; text-align: center; font-size: max(10.5px, .92cqw); color: var(--k2); }
.dl-c { min-width: 0; max-height: 100%; overflow: hidden; align-self: center; }
.dl-h { font: 500 max(10.5px, .95cqw) var(--f-mono); letter-spacing: .04em; color: var(--k2); padding-bottom: 6px; }
.dl-c .rl-r { padding: 6px 0; } .dl-c .rl-d { display: none; } .dl-c .rl-n { font-size: max(12.5px, 1.12cqw); } .dl-c .rl-v { font-size: max(13.5px, 1.25cqw); }
@container (max-width: 560px) { .dl { grid-template-columns: minmax(0, 1fr); } .dl-c { display: none; } }
/* ══ 第十二輪：今天。晨報的頭部、文字型的卡片 ══ */
.fc.w { grid-column: 1 / -1; }
.fc.q .ol-d { font-size: 15px; line-height: 1.6; color: var(--ink); }
.fx-b.go { color: var(--ac); border-color: color-mix(in srgb, var(--ac) 45%, transparent); }
.rl-r.nv { grid-template-columns: minmax(0, 1fr); } .rl-r.nv .rl-n { color: color-mix(in srgb, var(--ink) 78%, var(--sheet)); line-height: 1.55; }
.rl-n { line-height: 1.5; } .rl-n a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--ink) 30%, transparent); text-underline-offset: 3px; }
.rl-n a:hover { text-decoration-color: var(--ac); }
.rl-v { white-space: nowrap; }
.fc .rl-d { line-height: 1.6; }
.ov.br { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 4cqw; align-items: center; }
.ov.br .ov-l { gap: 1.6cqw; justify-content: center; }
.br-k { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font: 500 max(11px, 1cqw) var(--f-mono); letter-spacing: .08em; color: var(--k2); }
.br-k i { font: 500 max(11px, 1cqw) "Inter Tight", "Noto Sans TC", sans-serif; font-style: normal; letter-spacing: 0; border: 1px solid; border-radius: 999px; padding: 3px 10px; }
.br-h { margin: 0; font: 600 max(22px, 3.5cqw)/1.28 "Inter Tight", "Noto Sans TC", sans-serif; letter-spacing: -.005em; text-wrap: balance; color: var(--ink); }
.br-s { font-size: max(14px, 1.55cqw); line-height: 1.75; color: color-mix(in srgb, var(--ink) 74%, var(--sheet)); max-width: 36em; }
.br-r { display: flex; flex-direction: column; gap: .8cqw; min-width: 0; }
.br-r .ol-big { font-size: 5.4cqw; } .br-r .ol-u { font-size: .34em; }
.br-r .rl-r { padding: 7px 0; } .br-r .rl-n { font-size: max(13px, 1.2cqw); } .br-r .rl-v { font-size: max(14px, 1.35cqw); } .br-r .rl-d { font-size: max(11.5px, 1.02cqw); }
@container (max-width: 560px) { .ov.br { grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; } .br-h { font-size: 22px; } .br-s { font-size: 13.5px; line-height: 1.65; } .br-r .ol-big { font-size: 9cqw; } .br-r .rl-d { display: none; } }
/* ══ 第十三輪：出場。跑道和模擬器 ══ */
.sm-r { width: 100%; margin: 4px 0 0; accent-color: var(--ac); cursor: pointer; }
.ov-m > .dl-r { height: 100%; }
svg.rw { display: block; width: 100%; height: 100%; max-height: 100%; overflow: visible; cursor: default; }
