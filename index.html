.ov.gn { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 3.2cqw; }
.dl-c.hl { align-self: center; } .dl-c.hl .rl-d { display: block; } .dl-c.hl .rl-r { padding: 8px 0; }
@container (max-width: 560px) { .ov.gn { grid-template-columns: minmax(0, 1fr); } .ov.gn .dl-c { display: none; } }
/* 日夜鍵：和語言切換同一種外形（細框膠囊、實心滑塊）。保留三件事：圖示是一群點、邊上的光貼著游標、切換時繞一圈 */
.dn { width: 66px; height: 30px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); background: none; box-shadow: none; }
.oc[data-th="l"] .dn { box-shadow: none; }
.dn-b { position: absolute; left: 2px; top: 2px; width: 60px; height: 24px; pointer-events: none; }
.dn-k { top: 2px; left: 2px; width: 30px; height: 24px; border-radius: 999px; background: var(--ink); box-shadow: none; display: flex; align-items: center; justify-content: center; transition: transform .45s cubic-bezier(.2, .8, .2, 1), background-color .5s; }
.dn.b .dn-k { transform: translateX(30px); }
.dn-k canvas { width: 20px; height: 20px; }
.dn-k::before, .dn-k::after { inset: -3px; border-radius: 999px; padding: 1.5px; }
.dn-k::before { inset: -5px; border-radius: 999px; padding: 3px; filter: blur(4px); opacity: calc(var(--lo, .6) * .5); }
/* 一段裡最後落單的那張圖佔滿整列 */
.fg > .fc:last-child:nth-child(odd) { grid-column: 1 / -1; }
/* ══ 買盤來源圖、擁擠程度 ══ */
svg.fl { display: block; width: 100%; flex: 1; min-height: 0; overflow: visible; cursor: default; }
svg.fl text { font: 500 10.5px var(--f-mono); fill: var(--k2); }
svg.fl text.n { font: 500 12.5px "Inter Tight", "Noto Sans TC", sans-serif; fill: var(--ink); }
svg.fl text.c { font: 600 13px "Inter Tight", sans-serif; fill: var(--ink); letter-spacing: .08em; }
svg.fl text.v { font: 500 12.5px "Inter Tight", sans-serif; font-variant-numeric: tabular-nums; }
svg.fl .fl-s { cursor: pointer; } svg.fl .fl-s:hover text.n { fill: var(--ac); }
.fl-d.in { animation: flin 2s linear infinite; } .fl-d.out { animation: flout 2s linear infinite; }
@keyframes flin { from { stroke-dashoffset: 13.1; } to { stroke-dashoffset: 0; } }
@keyframes flout { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 13.1; } }
@media (prefers-reduced-motion: reduce) { .fl-d { animation: none !important; } }
@container (max-width: 560px) { svg.fl text.n { font-size: 19px; } svg.fl text { font-size: 14px; } svg.fl.cw text.n { font-size: 16.5px; } svg.fl text.v { font-size: 16px; } }
/* ════════════════════════════════════════════════════════════════════
   Daybreak next：整站骨架的樣式（2026-11-10 照整體規則重寫，取代之前一輪一輪疊上去的覆寫）
   規則：① 一頁三層：頭部（答案）→ 段落（小問題）→ 卡片（一張圖）
        ② 卡片固定四層：圖名 → 數字＋結論 → 控制＋圖例＋圖 → 一行補充；卡片裡沒有框、沒有色底
        ③ 顏色：字一律墨色／灰；橘紅只給異動的小點和頁面上最關鍵的數字；偏多偏空的顏色只在那幾個字和圖裡
        ④ 字級：段落標題、主圖數字、卡片數字、標題、內文、註記
        ⑤ 能點的只有三種長相：圖示圓鈕、分段切換、圖示展開鍵。能用圖示表達的鍵一律用圖示；文字只留給本身就是內容的選項（時間範圍、視角、章節、語言）
        ⑥ 彈簧只用在位置和大小；顏色用一般淡入
        ⑦ 圖上的標注文字一律放在膠囊裡（事件用實心，線的名字用細框）；色帶的說明放圖例，不寫在圖裡
        ⑧ 標題加粗：段落標題 800，圖名、結論標題、頁名 700
        ⑨ 展開、收回、進場只動位置、縮放和透明度（不裁切、不重畫大圖），才不會卡
        ⑪ 段落標題下面那一行是答案，不是問題：綜合這一段每張圖的結論，可以展開看每張圖各自說了什麼
        ⑫ 圖的顏色要鮮豔（會被截去當配圖）：色票用高飽和度，線不透明、夠粗，柱子不透明，色帶夠深；要壓暗的只有「重點上色」規則裡的其餘部分
        ⑬ 頭部的代表數字和今天頁的大標題用展示字（Archivo 壓窄 900／思源黑體 900），卡片裡的數字維持 Inter Tight
        ⑩ 找圖地圖（頂部九宮格鍵或按 /）：每張圖一格縮小版，可搜尋，點了就定位到那張圖
   ════════════════════════════════════════════════════════════════════ */
.oc { --t-sec: clamp(32px, 4.4vw, 66px); --t-hero: clamp(52px, 5cqw, 78px); --t-num: clamp(32px, 7cqw, 44px); --t-head: 17px; --t-body: 14px; --t-note: 12px;
  --rule: color-mix(in srgb, var(--ink) 11%, transparent); --soft: color-mix(in srgb, var(--ink) 78%, var(--sheet));
  --spring: cubic-bezier(.34, 1.56, .64, 1); }
@supports (transition-timing-function: linear(0, 1)) { .oc { --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1.004 83.8%, 1); } }

/* ── 互動的共通行為 ── */
.oc button { transition: transform .55s var(--spring), color .2s, background-color .2s, border-color .2s, opacity .2s; -webkit-tap-highlight-color: transparent; }
.oc button:active:not(:disabled) { transform: scale(.93); transition-duration: .08s; }
.oc .or-r:active, .oc .ov-c:active, .oc .pn button:active { transform: scale(.985); }
.oc button:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.oc details > summary { list-style: none; cursor: pointer; }
.oc details > summary::-webkit-details-marker { display: none; }

/* 圖示鍵的文字說明：游標停留一會兒才浮出來（整頁共用一個，由程式定位） */
.oc-tip { position: fixed; left: 0; top: 0; z-index: 200; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--sheet); font: 500 12px/1.25 "Inter Tight", "Noto Sans TC", sans-serif; letter-spacing: .02em; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateY(5px); transition: opacity .15s, transform .4s var(--spring); }
.oc-tip.on { opacity: 1; transform: none; }

/* ══ 導覽 ══ */
.oc-ch, .oc-sn { position: relative; }
.oc-ch::after, .oc-sn::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2.5px; border-radius: 2px; width: var(--w, 0px); transform: translateX(var(--x, 0px)); background: var(--ac); transition: transform .75s var(--spring), width .5s var(--spring); pointer-events: none; }
.oc-ch button[aria-current="true"], .oc-sn button[aria-current="true"] { color: var(--ink); border-bottom-color: transparent; }
.oc-tab { display: none; }
@media (min-width: 701px) {
  .oc-bar { padding-top: 12px; gap: 2px; }
  .oc-top b { font-size: 13px; }
  .oc-l { gap: 22px; flex: 1 1 auto; }
  .oc-ch { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .oc-ch button { font-size: 17px; font-weight: 500; letter-spacing: .04em; padding: 13px 18px 12px; border-bottom-width: 2px; }
  .oc-ch button[aria-current="true"] { font-weight: 600; }
  .oc-ch button:hover:not(:disabled), .oc-sn button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .oc-sn button { font-size: 14.5px; padding: 12px 14px 11px; }
  .oc-sn button i { font-size: 11px; }
}
@media (min-width: 701px) and (max-width: 1180px) { .oc-top .live { display: none; } .oc-ch button { padding-inline: 13px; font-size: 16px; } }
/* 每頁最後：上一頁／下一頁 */
.pn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 6px; }
.pn button { appearance: none; text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 18px 22px; border-radius: 16px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; font-family: "Inter Tight", "Noto Sans TC", sans-serif; }
.pn button:hover { border-color: color-mix(in srgb, var(--ink) 36%, transparent); }
.pn button.nx { text-align: right; align-items: flex-end; }
.pn small { display: block; color: var(--k2); } .pn button:hover small { color: var(--ink); } .pn small .ic { width: 20px; height: 20px; }
.pn b { font-size: 22px; font-weight: 700; }
.pn span { font-size: var(--t-body); line-height: 1.5; color: var(--k2); }

/* ══ 段落 ══ */
.oc-secs { max-width: none; gap: 84px; }
.fs-h { position: relative; border-top: 0; padding-top: 30px; flex-wrap: wrap; row-gap: 6px; }
.fs-h::before { content: ""; position: absolute; left: 0; top: 0; width: 64px; height: 5px; border-radius: 3px; background: var(--ac); }
.fs-h::after { content: ""; position: absolute; left: 76px; right: 0; top: 2px; height: 1px; background: var(--rule); }
.fs-h .k { font-size: 13px; }
.fs-h h3 { font-size: var(--t-sec); font-weight: 800; letter-spacing: -.025em; line-height: 1.08; white-space: normal; text-wrap: balance; min-width: 0; flex: 0 1 auto; }
.fs-h .sub { font-size: clamp(14px, 1.3vw, 19px); color: var(--soft); }

/* 段落的答案：標題下面一行，直接回答這一段的問題；可以展開看每張圖各自的結論 */
.fs-h .n { margin-left: auto; }
.fs-a { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 8px; min-width: 0; }
.fs-a b { font: 700 clamp(16px, 1.5vw, 21px)/1.5 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--ink); max-width: 62em; }
.fs-d { flex: 1 1 100%; min-width: 0; }
.fs-d > summary { display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 4px 11px 4px 6px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); font: 500 var(--t-note)/1 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--soft); font-variant-numeric: tabular-nums; transition: color .2s, background-color .2s, transform .55s var(--spring); }
.fs-d > summary .ic { transition: transform .5s var(--spring); }
.fs-d[open] > summary .ic { transform: rotate(180deg); }
.fs-d > summary:hover, .fs-d[open] > summary { background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); }
.fs-d > summary:active { transform: scale(.95); }
.fs-q { margin: 12px 0 4px; font-size: var(--t-note); line-height: 1.6; color: var(--k2); }
.fs-l { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0 32px; }
.oc .fs-r { appearance: none; display: grid; grid-template-columns: 3.6em minmax(0, 1fr); column-gap: 10px; align-items: start; text-align: left; padding: 11px 6px 11px 0; border: 0; border-top: 1px solid var(--rule); border-radius: 0; background: none; color: var(--ink); font-family: "Inter Tight", "Noto Sans TC", sans-serif; cursor: pointer; }
.oc .fs-r:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.oc .fs-r:active { transform: scale(.99); }
.fs-r .sy-t { padding-top: 2px; }
.fs-rb { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fs-rb small { font-size: var(--t-note); color: var(--k2); }
.fs-rb b { font: 700 var(--t-body)/1.4 "Inter Tight", "Noto Sans TC", sans-serif; }
.fs-rp { font-size: var(--t-note); line-height: 1.55; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ══ 卡片 ══ */
.fg { display: flex; flex-wrap: wrap; gap: 16px; }
.fg > .fc { flex: 1 1 540px; }
.fg > .fc.w, .fg > .fc:first-child:nth-last-child(n+3):not(.q) { flex-basis: 100%; }
.fc { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 22px 24px 16px; box-shadow: none; }
.fc:has([data-fx]) { cursor: zoom-in; }
.fc.q { cursor: pointer; }
@keyframes fcin { from { opacity: 0; transform: translateY(34px) scale(.965); } }
.oc.io .fc:not(.in) { opacity: 0; }
.oc.io .fc.in { animation: fcin .95s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 80ms); }
@media (hover: hover) {
  .fc { transition: transform .6s var(--spring), border-color .3s, background-color .5s; }
  .fc:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--ink) 20%, transparent); }
  /* 邊上一小段光跟著游標（墨色，不帶顏色） */
  .fc::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; background: radial-gradient(260px circle at var(--mx, -999px) var(--my, -999px), color-mix(in srgb, var(--ink) 70%, transparent), transparent 70%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; opacity: 0; transition: opacity .35s; pointer-events: none; z-index: 2; }
  .fc:hover::before { opacity: 1; }
}
.fc .ol { gap: 16px; }
.ol-a, .ol-b { display: contents; }
.ol > *, .ol-a > *, .ol-b > * { position: relative; z-index: 1; }

/* ① 圖名、展開鈕、異動 */
.fc h4.ol-n { font-size: var(--t-head); font-weight: 700; }
.ic { display: block; flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.fx-b { margin-left: auto; flex: none; position: relative; z-index: 3; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border-radius: 50%; background: none; border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); color: var(--ink); cursor: pointer; }
.fx-b::before { content: none; }
.fx-b.go { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 22%, transparent); background: none; }
.fc:hover .fx-b { border-color: color-mix(in srgb, var(--ink) 55%, transparent); }
.fx-b:hover, .fx-b:focus-visible { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.fx-b:hover .ic { transform: scale(1.12); } .fx-b .ic { transition: transform .5s var(--spring); }
.ol-sig { min-width: 0; }
.ol-sig > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 9px; font-size: var(--t-note); line-height: 1.5; color: var(--soft); }
.ol-sig > summary b { font-weight: 500; color: var(--ink); }
.sg-c { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--f-mono); letter-spacing: .08em; color: var(--ac); }
.sg-c i { width: 7px; height: 7px; border-radius: 50%; background: var(--ac); animation: lvbeat 1.6s ease-in-out infinite; }
.sg-n, .sg-f { color: var(--k2); font-variant-numeric: tabular-nums; }
.sg-i { padding: 9px 0 0 13px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: var(--t-note); line-height: 1.55; }
.sg-i b { font-weight: 600; color: var(--ink); }
.sg-i p { flex-basis: 100%; margin: 3px 0 0; color: var(--soft); }
.sg-i .sg-r { color: var(--k2); }

/* ② 答案：左邊數字，右邊結論 */
.ol-hl { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 30px; align-items: start; min-width: 0; }
.ol-hl.solo { grid-template-columns: minmax(0, 1fr); }
.ol-num { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fc .ol-k { font-size: var(--t-note); color: var(--k2); }
.fc .ol-big { font-size: var(--t-num); font-weight: 600; color: var(--ink); white-space: nowrap; }
.fc .ol-st { font-size: var(--t-note); max-width: 28em; }
.ol-st:has(> i) { padding: 0; background: none; }
.ol-say { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-left: 16px; border-left: 2px solid color-mix(in srgb, var(--ink) 18%, transparent); }
.sy-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 10px; }
.sy-t { font: 600 11px/1.3 var(--f-mono); letter-spacing: .08em; color: var(--sc, var(--k2)); white-space: nowrap; }
.sy-h > * { min-width: 0; max-width: 100%; } .sy-h > .sy-t { white-space: normal; overflow-wrap: anywhere; }   /* 2026-11-11 英文、字型還沒載入時「Read · Neutral」比欄寬，撐出 4px 橫向捲動 */
.sy-h b { font: 700 var(--t-head)/1.35 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--ink); }
.sy-d { margin: 0; font-size: var(--t-body); line-height: 1.65; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.ol-say.open .sy-d { -webkit-line-clamp: unset; display: block; }
.sy-c { margin: 0; font-size: var(--t-note); line-height: 1.6; color: var(--soft); }
.sy-c i { font-style: normal; font-weight: 600; color: var(--ink); margin-right: 8px; }
.sy-r { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 10px; align-items: baseline; padding: 9px 0 2px; margin-top: 8px; border-top: 1px solid var(--rule); }
.sy-k { font-size: var(--t-note); color: var(--k2); }
.sy-r b { font: 600 var(--t-body)/1.3 "Inter Tight", "Noto Sans TC", sans-serif; font-variant-numeric: tabular-nums; }
.sy-r i { font: 600 11px var(--f-mono); font-style: normal; }
.sy-r p { grid-column: 1 / -1; margin: 3px 0 0; font-size: var(--t-note); line-height: 1.6; color: var(--soft); }
/* 加號文字鍵：全部讀值、怎麼讀這張圖 */
.sy-m > summary, .ol-how > summary { display: inline-flex; align-items: center; gap: 7px; width: fit-content; padding: 2px 0; font: 500 var(--t-note)/1 "Inter Tight", "Noto Sans TC", sans-serif; color: color-mix(in srgb, var(--ink) 66%, var(--sheet)); transition: color .2s, transform .55s var(--spring); }
.sy-m > summary .ic, .ol-how > summary .ic { transition: transform .5s var(--spring); }
.sy-m > summary { gap: 5px; padding: 3px 9px 3px 5px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); font-variant-numeric: tabular-nums; }
.sy-m[open] > summary .ic { transform: rotate(180deg); }
.ol-how > summary { justify-content: center; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
.ol-how[open] > summary, .sy-m[open] > summary { background: color-mix(in srgb, var(--ink) 14%, transparent); color: var(--ink); }
.sy-m > summary:hover, .ol-how > summary:hover { color: var(--ink); }
.sy-m > summary:active, .ol-how > summary:active { transform: scale(.94); }

/* ③ 圖：分段切換、圖例、圖 */
.oc .ol-ctl { position: relative; z-index: 3; gap: 4px 8px; }
.oc .md { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 0; background: none; border: 0; border-radius: 0; }
.oc .ol-ctl .md + .md { margin-left: 2px; padding-left: 10px; border-left: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
.oc .md button { appearance: none; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; min-height: 26px; padding: 0 10px; border-radius: 999px; font: 500 var(--t-note)/1 "Inter Tight", "Noto Sans TC", sans-serif; letter-spacing: .02em; color: var(--k2); cursor: pointer; white-space: nowrap; }
.oc .md button:hover:not([aria-pressed="true"]) { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
.oc .md button[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 15%, transparent); color: var(--ink); font-weight: 600; cursor: default; }
.ol-ctl .more { appearance: none; border: 0; background: none; padding: 2px 0; font: 500 var(--t-note)/1.4 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--k2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.ol-ctl .more:hover { color: var(--ink); }
.fc .ol-lg { font-size: var(--t-note); gap: 3px 14px; }
@container (min-width: 1000px) { .fc .ol-c { height: 360px; } }
@container (min-width: 1500px) { .fc .ol-c { height: 430px; } }
/* 圖進到畫面時由左到右出現：一片和底色相同的遮板往右滑開（只動位置，不重畫圖）；觀察器沒有回報的環境（例如縮圖）不放遮板 */
@keyframes wipe { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.oc.io .fc .ol-c::after, .oc-fx .ol-c::after { content: ""; position: absolute; inset: -3px; background: var(--sheet); transform-origin: 100% 50%; transform: scaleX(0); pointer-events: none; z-index: 2; }
.oc.io .fc:not(.in) .ol-c::after { transform: scaleX(1); }
.oc.io .fc.in .ol-c::after { animation: wipe 1s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 120ms); }

/* ④ 補充：一行小字 */
.ol-f { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; min-width: 0; min-height: 40px; padding: 10px 40px 0 0; border-top: 1px solid var(--rule); }
.ol-sx { display: flex; flex-wrap: wrap; gap: 3px 16px; margin: 0; font: 500 var(--t-note)/1.5 "Inter Tight", "Noto Sans TC", sans-serif; color: var(--k2); }
.ol-sx span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ol-sx b { color: var(--soft); font-weight: 500; font-variant-numeric: tabular-nums; }
.ol-sx em { font-style: normal; color: var(--soft); margin-left: -3px; }
.sx-b { position: relative; flex: none; width: 46px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
.sx-b u { position: absolute; top: -3px; width: 3px; height: 9px; margin-left: -1.5px; border-radius: 1px; background: var(--ink); }
.ol-how { min-width: 0; flex: 1 1 100%; margin-right: -40px; }
.ol-how:not([open]) { flex: 0 0 0px; }
.ol-how > summary { position: absolute; right: 0; top: 6px; }   /* 鍵固定在右上角，點開、收起都在同一個位置 */
.ol-how p { margin: 8px 0 0; font-size: var(--t-body); line-height: 1.7; color: var(--soft); max-width: 70em; }
/* 清單裡的連結：不畫底線，後面一個外連小圖示（㉑ 5：原本是文字「↗」，換成同一套圖示） */
.oc .rl-n a { color: var(--ink); text-decoration: none; }
.oc .rl-n a:hover { color: var(--ac); }

/* 窄的卡片：數字和結論上下排 */
@container (max-width: 520px) { .ol-hl { grid-template-columns: minmax(0, 1fr); row-gap: 12px; } }
/* 每段的主圖（整列寬）：左邊是答案，右邊是圖，補充在最下面橫跨 */
@container (min-width: 980px) {
  .fc .ol[data-kind="t"] { display: grid; grid-template-columns: minmax(300px, 31%) minmax(0, 1fr); column-gap: 40px; row-gap: 16px; align-items: start; }
  .fc .ol[data-kind="t"] .ol-a, .fc .ol[data-kind="t"] .ol-b { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .fc .ol[data-kind="t"] .ol-big { font-size: var(--t-hero); }
  .fc .ol[data-kind="t"] .sy-d { -webkit-line-clamp: 6; }

}

/* ══ 頭部 ══ */

/* ══ 今天頁的頭部：一張海報。最粗的大標題、撐滿寬度的巨大收盤價（上面壓近 20 天的價格線）、三個用色的大數字 ══ */
.ov.br { display: flex; flex-direction: column; gap: min(1.1cqw, 1.6cqh); align-items: stretch; }
.ov.br .ov-l { gap: min(1.1cqw, 1.6cqh); justify-content: flex-start; }
.bp-top { display: flex; align-items: center; gap: 1.4cqw; font: 500 max(10px, 1.05cqw) var(--f-mono); letter-spacing: .1em; color: var(--k2); white-space: nowrap; }
.bp-top i { flex: 1; height: 1px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
.bp-tag { background: var(--ac); color: var(--bg); font: 800 max(11px, 1.2cqw)/1 "Noto Sans TC", sans-serif; letter-spacing: .14em; padding: .5cqw 1cqw; }
.br-h { margin: 0; font: 900 clamp(22px, min(5.6cqw, 6.4cqh), 84px)/1.1 "Archivo", "Noto Sans TC", sans-serif; font-stretch: 92%; letter-spacing: -.012em; text-wrap: balance; color: var(--ink); }
.ov.br .br-h.lg { font-size: clamp(20px, min(4.6cqw, 5.4cqh), 70px); }
.ov.br .br-h.xl { font-size: clamp(18px, min(3.8cqw, 4.6cqh), 58px); }
.bp-bar { display: flex; justify-content: space-between; gap: 2cqw; padding-top: 1cqw; border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); font: 500 max(10px, 1.05cqw) var(--f-mono); letter-spacing: .08em; color: var(--k2); white-space: nowrap; }

.ov.br .br-s { margin: 0; font-size: max(12.5px, min(1.5cqw, 2.3cqh)); line-height: 1.7; color: color-mix(in srgb, var(--ink) 80%, var(--sheet)); max-width: none; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.bp-kp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }

.bp-k em { font: 500 max(11px, 1.15cqw) var(--f-mono); font-style: normal; color: var(--ink); }

@container (max-width: 560px) { .bp-bot { grid-template-columns: minmax(0, 1fr); gap: 16px; } .bp-n { font-size: 27cqw; } .br-h { font-size: 7.4cqw; } .bp-top span:nth-of-type(1) { display: none; } .bp-k { padding-left: 10px; } .bp-k b { font-size: 8.4cqw; } .bp-hint { display: none; } }
/* 六頁共用的海報版型 */
.os-b.pp { display: flex; flex-direction: column; gap: min(1.3cqw, 2cqh); }
.os-b.pp > .ov { flex: 1 1 0; min-height: 0; height: auto; }
.pp-h { display: flex; flex-direction: column; gap: min(1cqw, 1.5cqh); padding-bottom: min(1.1cqw, 1.7cqh); border-bottom: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); }
.pp-hl { font-size: clamp(19px, min(3.9cqw, 5.3cqh), 60px); line-height: 1.14; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pp-hl.lg { font-size: clamp(17px, min(3.2cqw, 4.4cqh), 50px); }
.pp-hl.xl { font-size: clamp(16px, min(2.6cqw, 3.6cqh), 42px); }
.oc-hd .os.front .os-b.pp .ol-big { font-size: min(13.5cqw, 18cqh); line-height: .88; white-space: nowrap; }
.oc-hd .os.front .os-b.pp .ol-big small { margin-top: min(.7cqw, 1cqh); }
.oc-hd .os.front .os-b.pp .ol-u { font-family: "Inter Tight", "Noto Sans TC", sans-serif; font-stretch: 100%; font-weight: 600; }
/* 頭部的卡片同時是寬和高的容器：裡面的字級可以跟著兩邊取小的 */
.oc-hd .os { container-type: size; }

/* 各頁頭部的代表數字、退到後面的卡片上的數字，用同一套壓窄的粗字 */
.oc-hd .os.front .ol-big, .pw-n { font-family: "Archivo", "Inter Tight", "Noto Sans TC", sans-serif; font-stretch: 68%; font-weight: 900; letter-spacing: -.01em; }

/* ══ 展開：整個畫面。圖是橫向的，用滿寬度、高度適中；答案在圖上面一列，同一段的其他圖在最下面一排 ══ */
.oc-fx { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.oc-fx::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .58); opacity: 0; transition: opacity .35s; }
.oc-fx.on::before { opacity: var(--dim, 1); }
.oc-fx .os { left: 0; top: 0; width: 100%; height: 100%; transform: none; border: 0; border-radius: 0; box-shadow: none; background: var(--bg); overflow: hidden; cursor: zoom-out; }
.oc-fx .os::before { display: none; }
.oc-fx .os button, .oc-fx .os summary, .oc-fx .os a { cursor: pointer; }
.oc-fx .os-in { padding: 14px clamp(14px, 2vw, 30px) 14px; gap: 12px; animation: none; }
.oc-fx .os-h { gap: 14px; align-items: center; touch-action: none; }
.oc-fx .os-h .k { font-size: 11px; }
.oc-fx .os-h h3 { font-size: 19px; font-weight: 700; }
.oc-hd .os-h h3 { font-weight: 700; }
.oc-fx .os-h .sub { font-size: var(--t-body); }
.oc-fx .fx-x { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; margin-left: 8px; border-radius: 50%; background: none; border-color: color-mix(in srgb, var(--ink) 24%, transparent); }
.oc-fx .fx-x:hover { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.oc-fx #oc-fxl { margin-left: auto; }
.oc-fx .og { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 12px; }
.oc-fx .ol { gap: 14px; overflow-y: auto; scrollbar-width: none; }
.oc-fx .ol[data-kind="t"] { height: auto; max-height: 100%; }
.oc-fx .ol[data-kind="t"] .ol-c { flex: none; height: clamp(280px, 36vw, 56vh); min-height: 0; }
.oc-fx .ol-c { min-height: 260px; }
.oc-fx h4.ol-n { font-size: 22px; font-weight: 700; }
.oc-fx .ol-k { font-size: var(--t-note); }
.oc-fx .ol-big { font-size: clamp(40px, 3.6vw, 60px); font-weight: 600; }
.oc-fx .ol-big small { margin-top: 6px; font-size: 11px; }
.oc-fx .ol-st, .oc-fx .ol-lg { font-size: var(--t-note); }
.oc-fx .ol-hl { column-gap: 44px; row-gap: 12px; }
.oc-fx .sy-h b { font-size: 19px; }
.oc-fx .sy-d { -webkit-line-clamp: unset; display: block; font-size: 14.5px; max-width: 70em; }
.oc-fx .or { flex-direction: row; overflow-x: auto; overflow-y: hidden; border-top: 1px solid var(--rule); scrollbar-width: none; }
.oc-fx .or-r { flex: 0 0 clamp(190px, 17vw, 270px); min-height: 68px; column-gap: 12px; padding: 8px 12px; border-left: 0; border-bottom: 2px solid transparent; border-right: 1px solid var(--rule); cursor: pointer; }
.oc-fx .or-r:not([aria-pressed="true"]):hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.oc-fx .or-r[aria-pressed="true"] { border-bottom-color: var(--ac); }
.oc-fx .or-n { font-size: var(--t-note); }
.oc-fx .or-v { font-size: 16px; }
.oc-fx .or-s { display: block; height: 26px; max-height: none; }
/* 只看圖 */
.oc-fx.max .ol-hl, .oc-fx.max .ol-f, .oc-fx.max .ol-sig, .oc-fx.max .or, .oc-fx.max .os-h .sub { display: none; }
.oc-fx.max .ol[data-kind="t"] .ol-c { height: clamp(320px, 46vw, 76vh); }
/* 展開：一片底板從卡片的位置彈開成整個畫面，內容隨後彈出來；圖的遮板再滑開 */
.fx-gh { display: none; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0; background: var(--bg); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 18%, transparent), 0 50px 110px -30px rgba(0, 0, 0, .75); will-change: transform; }
.oc-fx .os { will-change: opacity, transform; }
.oc-fx .ol-c::after { background: var(--bg); animation: wipe 1s cubic-bezier(.2, .7, .2, 1) .28s backwards; }

/* 頭部：前面那張留出四周的空間；後面的幾頁一樣大，散在不同的深度、位置和角度，各有自己的內容 */
@keyframes frin { from { opacity: 0; transform: scale(.94) translateY(18px); } }
.os-pw { display: none; }
@media (min-width: 1240px) {
  .oc-hd .os { left: calc(50% - min(32%, 620px)); width: min(64%, 1240px); top: 11%; height: 82%; }
  .oc-hd .os.front { animation: frin .75s var(--spring) backwards; }
  .oc-hd .os:not(.front) { cursor: pointer; }
  .oc-hd .os:not(.front):hover { border-color: color-mix(in srgb, var(--ink) 38%, transparent); }
  .oc-hd .os:not(.front) .os-pw { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); grid-template-rows: auto auto minmax(0, 1fr); column-gap: 3cqw; row-gap: .9cqw; align-content: start; }
  .pw-k { grid-column: 1; font: 500 max(10.5px, 1cqw) var(--f-mono); letter-spacing: .06em; color: var(--k2); }
  .pw-n { grid-column: 1; font: 600 clamp(34px, 7cqw, 96px)/1 "Inter Tight", "Noto Sans TC", sans-serif; letter-spacing: -.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pw-l { grid-column: 1; margin: 0; font-size: max(13px, 1.45cqw); line-height: 1.5; color: var(--soft); max-width: 24em; }
  .pw-c { grid-column: 2; grid-row: 1 / -1; min-height: 0; }
  .pw-c svg { display: block; width: 100%; height: 100%; }
}
/* ⑭ 動效（v53）。通則：只動 transform、opacity 和個別的 translate／rotate／scale；一組元素一定有先後（40–90ms）；按下先縮、放開回彈；靜止的東西至少有一個活著的訊號。prefers-reduced-motion 時全部關掉 */
@property --pax { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --pay { syntax: "<length>"; inherits: false; initial-value: 0px; }
.oc-prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ac); transform-origin: 0 50%; transform: scaleX(0); pointer-events: none; z-index: 2; }
@media (prefers-reduced-motion: no-preference) {
  @keyframes m-rise { from { opacity: 0; transform: translate3d(0, 24px, 0); } }
  @keyframes m-rise-s { from { opacity: 0; transform: translate3d(0, 11px, 0); } }
  @keyframes m-fade { from { opacity: 0; } }
  @keyframes m-pop { 0% { transform: scale(.86); } 50% { transform: scale(1.09); } 100% { transform: scale(1); } }
  @keyframes m-grow { from { transform: scaleX(0); } }
  @keyframes m-ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pc, var(--ac)) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 13px transparent; } }
  @keyframes m-wipe { from { clip-path: inset(-20% 100% -20% 0); } to { clip-path: inset(-20% 0 -20% 0); } }
  @keyframes m-dg { from { opacity: 0; transform: translate3d(0, .5em, 0) scaleY(.6); } }
  @keyframes m-land { from { opacity: 0; transform: perspective(1400px) translate3d(0, 54px, 0) rotateX(9deg) scale(.955); } }
  @keyframes m-float { 0%, 100% { translate: var(--pax) calc(var(--pay) - 3px); rotate: -.5deg; } 50% { translate: var(--pax) calc(var(--pay) + 3px); rotate: .5deg; } }
  @keyframes m-shine { 0%, 80% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
  /* 切換 1：換頁時大卡的內容一層一層進來（.bp-bot 本身不位移，程式要量它的位置） */
  .oc-hd .os.front .os-b .ov > * > *:not(.bp-bot), .oc-hd .os.front .bp-bot > * { animation: m-rise .85s var(--spring) backwards; }
  .oc-hd .os.front .bp-bot { animation: m-fade .5s calc(var(--bt, 0s) + .3s) backwards; }
  .oc-hd .os.front .os-b .ov > * > :nth-child(1) { animation-delay: calc(var(--bt, 0s) + .08s); } .oc-hd .os.front .os-b .ov > * > :nth-child(2) { animation-delay: calc(var(--bt, 0s) + .15s); } .oc-hd .os.front .os-b .ov > * > :nth-child(3) { animation-delay: calc(var(--bt, 0s) + .22s); } .oc-hd .os.front .os-b .ov > * > :nth-child(4) { animation-delay: calc(var(--bt, 0s) + .3s); } .oc-hd .os.front .os-b .ov > * > :nth-child(n+5) { animation-delay: calc(var(--bt, 0s) + .38s); }
  .oc-hd .os.front .os-b .ov > :nth-child(2) > * { animation-delay: calc(var(--bt, 0s) + .36s); }
  .oc-hd .os.front .bp-bot > :nth-child(1) { animation-delay: calc(var(--bt, 0s) + .42s); } .oc-hd .os.front .bp-bot > :nth-child(n+2) { animation-delay: calc(var(--bt, 0s) + .52s); }
  .bp-l { animation: m-wipe 1.5s cubic-bezier(.16, 1, .3, 1) calc(var(--bt, 0s) + .35s) backwards; }
  .bp-dot { animation: m-pop .6s var(--spring) calc(var(--bt, 0s) + 1.6s) backwards, m-ping 2.6s ease-out 2.3s infinite; }
  .oc .live i { --pc: var(--up); animation: m-ping 2.6s ease-out infinite; border-radius: 50%; }
  /* 切換 2：段落標題捲到才進場——紅線伸出來、細線跟著拉開、標題升上來；之後紅線每隔幾秒掃過一道光 */
  .fs-h::before, .fs-h::after { transform-origin: 0 50%; }
  .oc.mo .fs-h:not(.m-in) > * { opacity: 0; }
  .oc.mo .fs-h:not(.m-in)::before, .oc.mo .fs-h:not(.m-in)::after { transform: scaleX(0); }
  .oc.mo .fs-h.m-in::before { animation: m-grow .8s var(--spring) backwards, m-shine 7s linear 2s infinite; background-image: linear-gradient(100deg, transparent 35%, color-mix(in srgb, #fff 60%, transparent) 50%, transparent 65%); background-size: 240% 100%; background-repeat: no-repeat; }
  .oc.mo .fs-h.m-in::after { animation: m-grow 1.2s cubic-bezier(.16, 1, .3, 1) .12s backwards; }
  .oc.mo .fs-h.m-in > .k { animation: m-rise-s .5s cubic-bezier(.16, 1, .3, 1) .05s backwards; }
  .oc.mo .fs-h.m-in > h3 { animation: m-rise .95s var(--spring) .1s backwards; }
  .oc.mo .fs-h.m-in > :not(.k):not(h3) { animation: m-rise-s .7s cubic-bezier(.16, 1, .3, 1) .3s backwards; }
  /* 切換 3：卡片帶一點前傾落下，裡面的名字、數字、圖、註腳一層層跟上；換時間範圍或畫法時（.m-re）內容快速重進 */
  .oc.io .fc.in { animation: m-land 1.05s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 90ms); }
  .fc .ol > :nth-child(2) { --j: 1; } .fc .ol > :nth-child(3) { --j: 2; } .fc .ol > :nth-child(4) { --j: 3; } .fc .ol > :nth-child(n+5) { --j: 4; }
  .oc.io .fc.in .ol > * { animation: m-rise-s .7s cubic-bezier(.16, 1, .3, 1) backwards; animation-delay: calc(var(--i, 0) * 90ms + 180ms + var(--j, 0) * 65ms); }
  .oc.io .fc.in.m-re .ol > * { animation-duration: .42s; animation-delay: calc(var(--j, 0) * 34ms); }
  .dg { display: inline-block; transform-origin: 50% 100%; animation: m-dg .75s var(--spring) backwards; animation-delay: calc(var(--dd, 0ms) + var(--d, 0) * 42ms); }
  .ol-how[open] > :not(summary) { animation: m-rise-s .4s cubic-bezier(.16, 1, .3, 1); }
  /* ⑲ 繪製效果 v2（2026-11-11，使用者：「飽和度太高、黑底下刺眼、佔太多目光，手機上尤其佔位，要高級一點」）。整套規則，CSS 和程式一起照這裡：
     1 顏色：五個 AI 不再各用一個高彩度的系列色。全部從次要文字色 --k2 出發，各混 14% 的系列色，只留很淡的色相差別：
       排版偏藍（--c3）、文案偏黃（--c5）、圖表偏青（--c4）；數據就是 --k2，校對是 --k2 和 --ink 各半（比較亮一點的灰）。
       不用綠（--up）和紅（--ac、--dn），綠紅只給方向。深淺兩個主題各自用自己的 --k2／--c3／--c4／--c5 算，所以淺色底上自動是深一點的灰。定義在 .oc 的 --ag-*。
     2 線：描邊一律 1px 實線，不用虛線。卡片外框 55% 不透明；區塊框、格線、參考線、上色刷邊 40% 以下，參考線最多 30%。
       沒有填色的色塊（區塊高亮只剩 1px 框）、沒有陰影、沒有光暈、沒有彈跳（spring 縮放），淡入淡出只動 opacity 和 transform。
     3 字：游標名字、外框尺寸、圖層名、「校對 AI」完成標記一律 10px、500 粗細、代理色的小字，不墊彩色底；
       要壓在內容上的（游標名字、完成標記）只墊一層 --sheet 85% 讓字讀得到。游標箭頭 13px，填代理色、描 1px 底色。

  const RNG = [[.86, 1.16, '近'], [.62, 1.72, '中'], [.6, 2.95, '全']], KC = { cost: 'var(--c4)', ma: 'var(--ink)', q: 'var(--c3)', vp: 'var(--c5)', opt: 'var(--c5)', exit: 'var(--ac)' }, F1 = v => (+v).toFixed(1), pc = v => sgn((v / P.px - 1) * 100, 1) + '%';
  const LN = [['urpd', '籌碼（URPD）'], ['opt', '選擇權未平倉'], ['gex', 'Gamma'], ['liq', '清算（推算）'], ['book', '掛單']], HINT = '把游標移到圖上，這裡會顯示那個價位有什麼。';
  function draw() {
    const w = box.clientWidth || 1000, h = box.clientHeight || 640, lo = P.px * RNG[rg][0], hi = P.px * RNG[rg][1], la = Math.log(lo), lb = Math.log(hi), Y = v => 26 + (1 - (Math.log(v) - la) / (lb - la)) * (h - 40), inr = v => v >= lo && v <= hi;
    const small = w < 600, LW = small ? w * .66 : Math.max(236, w * .29), lanes = small ? [LN[0], LN[4]] : LN, lw = (w - LW) / lanes.length; let g = '';
    const bar = (x, y0, y1, len, col, op) => `<rect x="${F1(x)}" y="${F1(Math.min(y0, y1) + .5)}" width="${F1(Math.max(.6, len))}" height="${F1(Math.max(1, Math.abs(y1 - y0) - 1))}" fill="${col}" fill-opacity="${op}"/>`;
    lanes.forEach((ln, i) => {
      const x0 = LW + i * lw + 10, ww = lw - 20, k = ln[0]; g += `<line x1="${F1(LW + i * lw)}" x2="${F1(LW + i * lw)}" y1="18" y2="${h - 8}" stroke="var(--ink)" stroke-opacity=".08"/><text x="${F1(x0)}" y="11" class="pm-h">${small ? ln[1].split("（")[0] : ln[1]}</text>`;
      if (k === 'urpd') { const R = P.urpd.rows.filter(r => r[0] + P.urpd.w > lo && r[0] < hi), mx = Math.max.apply(null, R.map(r => r[1] + r[2])) || 1; R.forEach(r => { const ya = Y(Math.min(hi, r[0] + P.urpd.w)), yz = Y(Math.max(lo, r[0])), l1 = r[2] / mx * ww, l2 = r[1] / mx * ww; g += bar(x0, ya, yz, l1, 'var(--c3)', .6) + bar(x0 + l1, ya, yz, l2, 'var(--ac)', .78); }); }
      else if (k === 'opt') { const R = P.opt.rows.filter(r => inr(r[0])), mx = Math.max.apply(null, R.map(r => Math.max(r[1], r[2]))) || 1, cx = x0 + ww / 2; R.forEach(r => { const y = Y(r[0]); g += bar(cx - r[2] / mx * ww / 2, y - 3, y + 3, r[2] / mx * ww / 2, 'var(--ac)', .8) + bar(cx, y - 3, y + 3, r[1] / mx * ww / 2, 'var(--up)', .8); }); g += `<line x1="${F1(cx)}" x2="${F1(cx)}" y1="20" y2="${h - 10}" stroke="var(--ink)" stroke-opacity=".14"/>`; }
      else if (k === 'gex') { const R = P.gex.filter(r => inr(r[0])), mx = Math.max.apply(null, R.map(r => Math.abs(r[1]))) || 1, cx = x0 + ww / 2; R.forEach(r => { const y = Y(r[0]), l = Math.abs(r[1]) / mx * ww / 2; g += r[1] >= 0 ? bar(cx, y - 3, y + 3, l, 'var(--up)', .85) : bar(cx - l, y - 3, y + 3, l, 'var(--ac)', .85); }); g += `<line x1="${F1(cx)}" x2="${F1(cx)}" y1="20" y2="${h - 10}" stroke="var(--ink)" stroke-opacity=".14"/>`; }
      else if (k === 'liq') { const R = P.liq.rows.filter(r => r[0] + P.liq.step > lo && r[0] < hi), mx = Math.max.apply(null, R.map(r => r[1])) || 1; R.forEach(r => { g += bar(x0, Y(Math.min(hi, r[0] + P.liq.step)), Y(Math.max(lo, r[0])), r[1] / mx * ww, r[0] >= P.px ? 'var(--up)' : 'var(--ac)', .7); }); }
      else { const R = P.book.rows.filter(r => r[0] + P.book.step > lo && r[0] < hi), mx = Math.max.apply(null, R.map(r => r[2])) || 1; R.forEach(r => { g += bar(x0, Y(Math.min(hi, r[0] + P.book.step)), Y(Math.max(lo, r[0])), r[2] / mx * ww, r[1] === 'b' ? 'var(--up)' : 'var(--ac)', .72); }); }
    });
    const L = P.lines.filter(x => inr(x[0])).sort((a, b) => b[0] - a[0]).map(x => ({ v: x[0], n: x[1], k: x[2], c: x[3] ? (/^[a-z0-9]+$/i.test(x[3]) ? 'var(--' + x[3] + ')' : x[3]) : null, y: Y(x[0]), ly: Y(x[0]) }));
    for (let i = 1; i < L.length; i++) if (L[i].ly < L[i - 1].ly + 13.5) L[i].ly = L[i - 1].ly + 13.5;
    const over = L.length ? L[L.length - 1].ly - (h - 8) : 0; if (over > 0) { L[L.length - 1].ly -= over; for (let i = L.length - 2; i >= 0; i--) if (L[i].ly > L[i + 1].ly - 13.5) L[i].ly = L[i + 1].ly - 13.5; }
    L.forEach(x => { const c = x.c || KC[x.k]; g += `<line x1="${F1(LW - 4)}" x2="${w}" y1="${F1(x.y)}" y2="${F1(x.y)}" stroke="${c}" stroke-opacity=".3" stroke-width=".8"${x.k === 'q' || x.k === 'vp' ? ' stroke-dasharray="2 4"' : ''}/><path d="M${F1(LW - 4)},${F1(x.y)}L${F1(LW - 20)},${F1(x.ly)}" stroke="${c}" stroke-opacity=".5" fill="none"/><text x="${F1(LW - 24)}" y="${F1(x.ly + 3.5)}" text-anchor="end" class="pm-l"><tspan style="fill:${c}">${x.n}</tspan><tspan dx="8" class="v">$${n0(x.v)}</tspan>${small ? '' : `<tspan dx="7" class="p">${pc(x.v)}</tspan>`}</text>`; });
    const yc = Y(P.px); g += `<line x1="0" x2="${w}" y1="${F1(yc)}" y2="${F1(yc)}" stroke="var(--ac)" stroke-width="1.3"/><circle class="pulse" cx="${F1(LW - 4)}" cy="${F1(yc)}" r="5" style="stroke:var(--ac)"/><circle cx="${F1(LW - 4)}" cy="${F1(yc)}" r="3.6" fill="var(--ac)"/><text x="${F1(w - 4)}" y="${F1(yc - 6)}" text-anchor="end" class="pm-cl">收盤 $${n0(P.px)}</text>`;
    g += `<g class="pm-x" visibility="hidden"><line x1="0" x2="${w}" stroke="var(--ink)" stroke-opacity=".6"/></g><rect x="0" y="0" width="${w}" height="${h}" fill="transparent" style="cursor:crosshair;touch-action:pan-x"/>`;
    box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="價位地圖">${g}</svg>`; G = { h, la, lb, x: box.querySelector('.pm-x') };
  }
  const at = (rows, step, p, f) => { const r = rows.find(x => p >= x[0] && p < x[0] + step); return r ? f(r) : null; };
  function hover(e) {
    const b = box.getBoundingClientRect(), y = (e.clientY - b.top) / b.height * G.h, p = Math.exp(G.la + (1 - (y - 26) / (G.h - 40)) * (G.lb - G.la)); G.x.setAttribute('visibility', 'visible'); const ln = G.x.querySelector('line'); ln.setAttribute('y1', F1(y)); ln.setAttribute('y2', F1(y));
    const near = P.lines.map(x => [Math.abs(x[0] / p - 1), x]).sort((a, c) => a[0] - c[0])[0], out = ['<b>$' + n0(p) + '</b>　離收盤 ' + pc(p)];
    if (near && near[0] < .012) out.push(near[1][1] + ' $' + n0(near[1][0]));
    const u = at(P.urpd.rows, P.urpd.w, p, r => '籌碼 ' + n0((r[1] + r[2]) / 1e4) + ' 萬顆（短期 ' + n0(r[1] / 1e4) + '、長期 ' + n0(r[2] / 1e4) + '）'); if (u) out.push(u);
    const o = P.opt.rows.map(r => [Math.abs(r[0] - p), r]).sort((a, c) => a[0] - c[0])[0]; if (o && o[0] < 1000) out.push('履約價 $' + n0(o[1][0]) + '：買權 ' + n0(o[1][1]) + '、賣權 ' + n0(o[1][2]));
    const k = at(P.book.rows, P.book.step, p, r => (r[1] === 'b' ? '買單 ' : '賣單 ') + n0(r[2]) + ' 顆'); if (k) out.push(k);
    rd.innerHTML = out.join('<i></i>');
  }
  box.addEventListener('pointermove', e => { if (G) hover(e); });
  box.addEventListener('pointerleave', () => { if (G) G.x.setAttribute('visibility', 'hidden'); rd.textContent = HINT; });
  rgb.innerHTML = RNG.map((r, i) => `<button type="button" data-i="${i}" aria-pressed="${i === rg}">${r[2]}</button>`).join('');
  rgb.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); rg = +b.dataset.i; $$('button', rgb).forEach(x => x.setAttribute('aria-pressed', +x.dataset.i === rg)); draw(); });
  rd.textContent = HINT; draw(); return draw;
}
function initPM() { return pmChart($('#pm-c'), $('#pm-r'), $('#pm-g')); }

</script>
