<script>
/* 2026-11-09 換語言的轉場：上一頁剛按了語言切換（8 秒內）→ 開機就先蓋一層同底色的暮色，等新語言畫好再解碼淡出（app.js langIn），不會閃白 */
try { (function () { var fx = JSON.parse(sessionStorage.getItem('daybreak.lfx') || 'null'), d = document.documentElement; if (fx && Date.now() - fx.t < 8000) { d.classList.add('lfx-in', 'lfx-came'); d.style.setProperty('--lfx-bg', localStorage.getItem('daybreak.theme') === 'dark' ? '#0C0C0D' : '#EEECE6'); } })(); } catch (e) {}
</script>
<script>
/* 開機：先決定語言再啟動 app.js（2026-10-12）。使用者在頁面上選過語言 → 一律沿用（daybreak.lang）；
   沒選過 → 依 IP 國家：台灣、香港、澳門、中國大陸、新加坡用中文，其他用英文（查詢結果快取 7 天）；IP 查不到 → 看瀏覽器語言。 */
window.DAYBREAK_BOOT = (function () {
  var ZH = ['TW', 'HK', 'MO', 'CN', 'SG'], ls = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  function go(l) {
    window.DAYBREAK_LANG = l; document.documentElement.lang = l === 'en' ? 'en' : 'zh-Hant';
    if (l !== 'en') return Promise.resolve();
    return new Promise(function (ok) { var s = document.createElement('script'); s.src = 'assets/i18n-en.js?v=68216ad7ba'; s.onload = s.onerror = function () { ok(); }; document.head.appendChild(s); });
  }
  var pick = ls('daybreak.lang'); if (pick === 'zh' || pick === 'en') return go(pick);
  var byCC = function (cc) { return ZH.indexOf(String(cc).toUpperCase()) >= 0 ? 'zh' : 'en'; };
  try { var g = JSON.parse(ls('daybreak.geo') || 'null'); if (g && g.cc && Date.now() - g.t < 7 * 864e5) return go(byCC(g.cc)); } catch (e) {}
  var nav = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  var ask = function (u, f) { return fetch(u, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { var c = f(j); if (!c) throw 0; return c; }); };
  var cc = ask('https://api.country.is/', function (j) { return j.country; }).catch(function () { return ask('https://get.geojs.io/v1/ip/country.json', function (j) { return j.country; }); });
  var late = new Promise(function (ok) { setTimeout(function () { ok(null); }, 1500); });
  return Promise.race([cc.catch(function () { return null; }), late]).then(function (c) {
    if (c) ls('daybreak.geo', JSON.stringify({ cc: c, t: Date.now() }));
    return go(c ? byCC(c) : nav);
  });
})();
</script>

<script>
/* 2026-11-09 換語言不留空白：上一頁存的畫面快照（sessionStorage daybreak.lfx，app.js pickLang）→ 一開頭就擺出來，等新語言畫好由 app.js langIn 拿掉並接著解碼。
   使用者：「會在亂碼狀態停留卡住的感覺，需要一直動態變」→ 亂碼不靠 JS 計時（新頁面載入、畫圖時主執行緒會被佔住，JS 動畫就停了）：
   先做 6 份各自亂碼的快照疊起來，用 CSS 每 60 毫秒輪流顯示一份（透明度動畫由合成器跑，主執行緒忙也照樣在變）。
   同日再改（使用者 iPhone 錄影：換語言時舊畫面會往上縮一截、頂部列不見、停約 0.35 秒再跳回來）：快照原本放 iframe，
   iPhone 的瀏覽器要等新頁面「主畫面」有足夠的字才肯換掉舊畫面，iframe 裡的字不算，所以一直顯示被往上推的舊畫面，等資料畫好才換。
   改放進主頁面的 shadow DOM：字算在主畫面裡，新頁面第一次繪製就是快照；shadow DOM 和頁面隔開，app.js 的全頁查詢與 id 都不會抓到快照裡的元素。
   樣式從已載入的 app.css 逐條抄進 shadow root，選擇器裡的 html／:root／body 換成快照的外框 .lfx-html／.lfx-body；捲動位置由快照外框自己捲（黏住的頂部列照樣黏住） */
(function () { try {
  var fx = JSON.parse(sessionStorage.getItem('daybreak.lfx') || 'null'); if (!fx || !fx.h || Date.now() - fx.t > 8000) return;
  var host = document.createElement('div'); if (!host.attachShadow) return;
  var css = '', rw = function (s) { return s.replace(/(^|[\s,>+~(])(?::root|html)(?![\w-])/g, '$1.lfx-html').replace(/(^|[\s,>+~(])body(?![\w-])/g, '$1.lfx-body'); };
  var dump = function (rules) {
    var o = '';
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      if (window.CSSStyleRule && r instanceof CSSStyleRule) o += rw(r.selectorText) + '{' + r.style.cssText + '}';
      else if (window.CSSMediaRule && r instanceof CSSMediaRule) o += '@media ' + r.media.mediaText + '{' + dump(r.cssRules) + '}';
      else if (window.CSSSupportsRule && r instanceof CSSSupportsRule) o += '@supports ' + r.conditionText + '{' + dump(r.cssRules) + '}';
      else o += r.cssText;
    }
    return o;
  };
  for (var si = 0; si < document.styleSheets.length; si++) { var ss = document.styleSheets[si]; if (ss.href && ss.href.indexOf('assets/app.css?v=68216ad7ba') >= 0) { try { css = dump(ss.cssRules); } catch (e) {} } }
  if (!css) return;   // 讀不到樣式就不擺快照，照舊用暮色
  var P = { c: '比特幣價格週期鏈上資金衍生品出場框架往期方法市場多空頂底熱度成本獲利籌碼供給短長持有者流入淨變化率指數訊號風險波動未實現選擇權到期履約今天新一期判讀結論', n: 'fijlrtI', w: 'mwMW', u: 'ABCDEFGHJKLNOPQRSTUVXYZ', l: 'abcdeghknopqsuvxyz', d: '0123456789' }, K = 6;   // 英文字母依寬度分組換字（同 app.js lfxKind）
  var kind = function (ch) { var n = ch.charCodeAt(0); return n >= 13312 && n <= 40959 ? 'c' : /[0-9]/.test(ch) ? 'd' : !/[A-Za-z]/.test(ch) ? '' : /[fijlrtI]/.test(ch) ? 'n' : /[mwMW]/.test(ch) ? 'w' : ch < 'a' ? 'u' : 'l'; };
  var tpl = document.createElement('template'); tpl.innerHTML = fx.h;
  var frames = '';
  for (var f = 0; f < K; f++) {
    var box = document.createElement('div'); box.className = 'lfx-f'; box.style.animationDelay = (-f * 60) + 'ms'; box.appendChild(tpl.content.cloneNode(true));
    var w = document.createTreeWalker(box, 4), n, list = []; while ((n = w.nextNode())) list.push(n);
    list.forEach(function (n) { var a = Array.from(n.nodeValue), o = ''; for (var i = 0; i < a.length; i++) { var k = kind(a[i]); o += k && Math.random() < .82 ? P[k].charAt((Math.random() * P[k].length) | 0) : a[i]; } n.nodeValue = o; });
    frames += box.outerHTML;
  }
  host.className = 'lfx-ghost'; host.setAttribute('aria-hidden', 'true'); host.style.width = (fx.w | 0) + 'px';
  var sr = host.attachShadow({ mode: 'open' }), esc = function (x) { return String(x || '').replace(/[^\w -]/g, ''); };
  sr.innerHTML = '<style>' + css +
    '.lfx-sc{position:absolute;top:0;right:0;bottom:0;left:0;overflow:auto;scrollbar-width:none;background:var(--void)}.lfx-sc::-webkit-scrollbar{display:none}' +
    '.lfx-html,.lfx-body{height:auto;min-height:100%}.lfx-body{position:relative;margin:0}' +
    '.lfx-f{position:absolute;top:0;left:0;width:100%;opacity:0;will-change:opacity;animation:lfxf ' + (K * 60) + 'ms steps(1,end) infinite}.lfx-f:first-child{position:relative}' +
    '@keyframes lfxf{0%{opacity:1}' + (100 / K).toFixed(3) + '%{opacity:0}100%{opacity:0}}</style>' +
    '<div class="lfx-sc"><div class="lfx-html lfx-came" lang="' + (fx.lang === 'en' ? 'en' : 'zh-Hant') + '"' + (fx.theme === 'dark' ? ' data-theme="dark"' : '') + '><div class="lfx-body ' + esc(fx.bc) + '">' + frames + '</div></div></div>';
  document.documentElement.appendChild(host); sr.querySelector('.lfx-sc').scrollTop = fx.y | 0;
  window.DAYBREAK_LFX_GHOST = host;
} catch (e) {} })();
</script>
