<script>
/* 開機：先決定語言再啟動 app.js（2026-10-12）。使用者在頁面上選過語言 → 一律沿用（daybreak.lang）；
   沒選過 → 依 IP 國家：台灣、香港、澳門、中國大陸、新加坡用中文，其他用英文（查詢結果快取 7 天）；IP 查不到 → 看瀏覽器語言。 */
window.DAYBREAK_BOOT = (function () {
  var ZH = ['TW', 'HK', 'MO', 'CN', 'SG'], ls = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  function go(l) {
    window.DAYBREAK_LANG = l; document.documentElement.lang = l === 'en' ? 'en' : 'zh-Hant';
    if (l !== 'en') return Promise.resolve();
    return new Promise(function (ok) { var s = document.createElement('script'); s.src = 'assets/i18n-en.js?v=6b78c370b8'; s.onload = s.onerror = function () { ok(); }; document.head.appendChild(s); });
  }
  var pick = ls('daybreak.lang'); if (pick === 'zh' || pick === 'en') return go(pick);
  var byCC = function (cc) { return ZH.indexOf(String(cc).toUpperCase()) >= 0 ? 'zh' : 'en'; };
  try { var g = JSON.parse(ls('daybreak.geo') || 'null'); if (g && g.cc && Date.now() - g.t < 7 * 864e5) return go(byCC(g.cc)); } catch (e) {}
  var nav = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  var ask = function (u, f) { return fetch(u, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { var c = f(j); if (!c) throw 0; return c; }); };
  var cc = ask('https://api.country.is/', function (j) { return j.country; }).catch(function () { return ask('https://get.geojs.io/v1/ip/country.json', function (j) { return j.country; }); });
  var late = new Promise(function (ok) { setTimeout(function () { ok(null); }, 1500); });
  return Promise.race([cc.catch(function () { return null; }), late]).then(function (c) {
    if (c) ls('daybreak.geo', JSON.stringify({ cc: c, t: Date.now() }));
    return go(c ? byCC(c) : nav);
  });
})();
</script>
